<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Partnerportal</title>
<style>
  .partner-portal {
    --navy: #15243a;
    --green: #163674;
    --line: #d6dde3;
    --muted: #5d6b80;
    --page: #f5f7f9;
    --surface: #fff;
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 24px 64px;
    background: var(--page);
    color: var(--navy);
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  .partner-portal * {
    box-sizing: border-box;
  }

  .portal-intro {
    margin-bottom: 30px;
  }

  .eyebrow {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
  }

  .portal-title {
    margin: 0;
    font-size: 36px;
    line-height: 1.1;
  }

  .portal-description {
    margin: 8px 0 0;
    color: var(--muted);
    line-height: 1.5;
  }

  .admin-link {
    display: none;
    margin-top: 14px;
    color: var(--green);
    font-size: 14px;
    font-weight: bold;
    text-underline-offset: 3px;
  }

  .member-links {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .mobile-section-tabs {
    display: none;
  }

  .portal-grid {
    display: grid;
    grid-template-columns: minmax(0, .95fr) minmax(0, 1.15fr);
    gap: 32px;
  }

  .portal-panel {
    min-width: 0;
  }

  .portal-heading {
    margin: 0 0 16px;
    color: var(--navy);
    font-size: 22px;
    letter-spacing: .5px;
  }

  .group-list,
  .meeting-list {
    display: grid;
    gap: 14px;
  }

  .meeting-list {
    grid-column: 1 / -1;
  }

  .group-list {
    margin-top: 0;
  }

  .group-card {
    display: grid;
    grid-template-columns: 56px minmax(0, 1fr);
    gap: 16px;
    align-items: center;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: inherit;
    text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }

  a.group-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
  }

  .group-avatar {
    display: flex;
    width: 56px;
    height: 56px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    font-size: 22px;
    font-weight: bold;
  }

  .group-card h3,
  .meeting h3 {
    margin: 0 0 6px;
    font-size: 18px;
  }

  .group-card h3 {
    color: var(--green);
  }

  .portal-meta {
    margin: 3px 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: -4px 0 16px;
    justify-content: flex-start;
  }

  .filter-button {
    padding: 8px 13px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--navy);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }

  .filter-select {
    min-height: 36px;
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--navy);
    font: inherit;
    font-size: 13px;
  }

  .filter-button:hover,
  .filter-button.active {
    border-color: var(--green);
    background: var(--green);
    color: #fff;
  }

  .meeting {
    padding: 17px 18px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
  }

  .meeting-topline {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .status {
    flex-shrink: 0;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: .4px;
    text-transform: uppercase;
  }

  .upcoming { background: #e5f4ef; color: var(--green); }
  .held { background: #edf0f2; color: #58636c; }
  .cancelled { background: #fbe8e8; color: #a63a3a; }

  @media (max-width: 800px) {
    .portal-grid {
      grid-template-columns: 1fr;
      gap: 34px;
    }

    .group-list {
      margin-top: 0;
    }
  }

  @media (max-width: 700px) {
    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    .partner-portal {
      width: 100%;
      max-width: 100% !important;
      padding: 28px 16px 48px;
      overflow: hidden;
    }

    .portal-intro {
      margin-bottom: 18px;
    }

    .portal-title {
      font-size: 34px !important;
    }

    .portal-description {
      font-size: 16px;
    }

    .mobile-section-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 18px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      width: 100%;
      max-width: 100%;
    }

    .mobile-section-tabs button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--navy);
      font: inherit;
      font-weight: bold;
    }

    .mobile-section-tabs button.active {
      background: var(--green);
      color: #fff;
    }

    .portal-grid {
      display: block;
      width: 100%;
      max-width: 100%;
    }

    .portal-panel {
      display: none;
    }

    .portal-panel.active-mobile-panel {
      display: block;
      width: 100%;
      max-width: 100%;
    }

    .portal-heading {
      margin-bottom: 12px;
      font-size: 24px !important;
    }

    .group-list,
    .meeting-list {
      gap: 10px;
    }

    .group-card,
    .meeting {
      width: 100%;
      max-width: 100%;
      padding: 16px;
    }

    .group-card h3,
    .meeting h3,
    .portal-meta {
      overflow-wrap: anywhere;
    }

    .meeting-topline {
      align-items: flex-start;
      flex-direction: column;
      gap: 6px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 100%;
    }

    .filter-button,
    .filter-select {
      width: 100%;
      min-width: 0;
      white-space: normal;
    }

    .filter-select {
      grid-column: 1 / -1;
    }
  }
</style>
</head>
<body>

<div class="partner-portal">
  <header class="portal-intro">
    <p class="eyebrow">Netværk</p>
    <h1 class="portal-title">Partnerportal</h1>
    <p class="portal-description">Find dine netværksgrupper og hold dig opdateret om kommende møder.</p>
  </header>

  <div class="mobile-section-tabs" aria-label="Vælg indhold">
    <button class="active" type="button" data-mobile-section="groups">Grupper</button>
    <button type="button" data-mobile-section="meetings">Møder</button>
  </div>

  <div class="portal-grid">
    <section class="portal-panel active-mobile-panel" data-mobile-panel="groups">
      <h2 class="portal-heading">Grupper</h2>

      <div class="group-list" id="group-list"></div>
    </section>

    <section class="portal-panel" data-mobile-panel="meetings">
      <h2 class="portal-heading">Årets møder</h2>

      <div class="filters">
        <button class="filter-button active" type="button" data-filter="all">Alle</button>
        <button class="filter-button" type="button" data-filter="upcoming">Kommende</button>
        <button class="filter-button" type="button" data-filter="held">Afholdte</button>
        <button class="filter-button" type="button" data-filter="cancelled">Aflyste</button>
        <select class="filter-select" id="meeting-group-filter" aria-label="Filtrer møder efter gruppe">
          <option value="">Alle grupper</option>
        </select>
      </div>

      <div class="meeting-list" id="meeting-list"></div>
    </section>
  </div>
</div>

<script src="portal-data.js?v=20260604-02"></script><script src="portal-header.js?v=20260717-04"></script>
<script>
  var statusLabels = { upcoming: "Kommende", held: "Afholdt", cancelled: "Aflyst" };
  var selectedMeetingStatus = "all";
  function setMobileSection(section) {
    document.querySelectorAll("[data-mobile-section]").forEach(function (button) {
      button.classList.toggle("active", button.dataset.mobileSection === section);
    });
    document.querySelectorAll("[data-mobile-panel]").forEach(function (panel) {
      panel.classList.toggle("active-mobile-panel", panel.dataset.mobilePanel === section);
    });
  }
  function effectiveMeetingStatus(meeting) {
    if (meeting.status === "cancelled") return "cancelled";
    var time = String(meeting.time || "00:00").slice(0, 5);
    var startsAt = new Date(String(meeting.date || "") + "T" + time + ":00");
    return !Number.isNaN(startsAt.getTime()) && startsAt < new Date()
      ? "held"
      : (meeting.status || "upcoming");
  }
  function meetingStart(meeting) {
    var time = String(meeting.time || "00:00").slice(0, 5);
    var startsAt = new Date(String(meeting.date || "") + "T" + time + ":00");
    return Number.isNaN(startsAt.getTime()) ? 0 : startsAt.getTime();
  }
  function sortMeetings(meetings) {
    return meetings.slice().sort(function (a, b) {
      var aStatus = effectiveMeetingStatus(a), bStatus = effectiveMeetingStatus(b);
      var aUpcoming = aStatus === "upcoming", bUpcoming = bStatus === "upcoming";
      if (aUpcoming !== bUpcoming) return aUpcoming ? -1 : 1;
      return aUpcoming ? meetingStart(a) - meetingStart(b) : meetingStart(b) - meetingStart(a);
    });
  }
  function applyMeetingFilters() {
    var groupId = document.getElementById("meeting-group-filter").value;
    document.querySelectorAll(".partner-portal .meeting").forEach(function (meeting) {
      var statusMatch = selectedMeetingStatus === "all" || meeting.dataset.status === selectedMeetingStatus;
      var groupIds = (meeting.dataset.groupIds || "").split(",").filter(Boolean);
      var groupMatch = !groupId || groupIds.includes(groupId);
      meeting.style.display = statusMatch && groupMatch ? "block" : "none";
    });
  }
  Promise.all([PortalData.groups(), PortalData.session()]).then(async function (results) {
    var groups = results[0], session = results[1], accessible = [];
    if (session.loggedIn) accessible = await PortalData.myGroups();
    var allowed = accessible.map(function (group) { return group.id; });
    document.getElementById("meeting-group-filter").innerHTML = '<option value="">Alle grupper</option>' + groups.map(function (group) {
      return '<option value="' + PortalData.escape(group.id) + '">' + PortalData.escape(group.name) + '</option>';
    }).join("");
    document.getElementById("group-list").innerHTML = groups.map(function(group,index) {
      var tag = allowed.includes(group.id) ? 'a href="gruppe.html?id='+encodeURIComponent(group.id)+'"' : "div";
      return '<'+tag+' class="group-card"><span class="group-avatar">'+(index+1)+'</span><span><h3>'+PortalData.escape(group.name)+'</h3><p class="portal-meta">'+PortalData.escape(group.address||"")+'</p></span></'+(tag.startsWith("a ")?"a":"div")+'>';
    }).join("");
    applyMeetingFilters();
  });
  PortalData.meetings().then(function (meetings) {
    document.getElementById("meeting-list").innerHTML = sortMeetings(meetings).map(function (meeting) {
    var status = effectiveMeetingStatus(meeting);
    var date = new Date(meeting.date + "T00:00:00").toLocaleDateString("da-DK", { day: "numeric", month: "long", year: "numeric" });
      var groupIds = (meeting.groupIds || []).map(String).join(",");
      return '<a class="meeting" data-status="' + PortalData.escape(status) + '" data-group-ids="' + PortalData.escape(groupIds) + '" href="moede.html?id=' + encodeURIComponent(meeting.slug) + '" style="display:block;color:inherit;text-decoration:none">' +
        '<div class="meeting-topline"><h3>' + PortalData.escape(meeting.title) + '</h3><span class="status ' + PortalData.escape(status) + '">' + PortalData.escape(statusLabels[status] || status) + '</span></div>' +
        '<p class="portal-meta">' + date + ' &middot; kl. ' + PortalData.escape(meeting.time) + '</p>' +
        (meeting.groupNames ? '<p class="portal-meta">' + PortalData.escape(meeting.groupNames) + '</p>' : '') +
        '<p class="portal-meta">' + PortalData.escape(meeting.address) + '</p></a>';
    }).join("");
    applyMeetingFilters();
  }).catch(function () {
    document.getElementById("meeting-list").innerHTML = '<p class="portal-meta">Møder kunne ikke hentes fra databasen.</p>';
  });

  document.querySelectorAll(".partner-portal .filter-button").forEach(function (button) {
    button.addEventListener("click", function () {
      selectedMeetingStatus = button.dataset.filter;
      document.querySelectorAll(".partner-portal .filter-button").forEach(function (item) {
        item.classList.remove("active");
      });
      button.classList.add("active");
      applyMeetingFilters();
    });
  });
  document.getElementById("meeting-group-filter").addEventListener("change", applyMeetingFilters);
  document.querySelectorAll("[data-mobile-section]").forEach(function (button) {
    button.addEventListener("click", function () {
      setMobileSection(button.dataset.mobileSection);
    });
  });
</script>
</body>
</html>

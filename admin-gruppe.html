<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gruppe | Administration</title><link rel="stylesheet" href="portal-header.css?v=20260610-01"><style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--danger:#a12626}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:980px;margin:auto;padding:40px 24px 64px}a{color:var(--green)}h1{margin:10px 0 6px}.meta{color:var(--muted)}.panel{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}.toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}label{display:block;color:var(--muted);font-size:13px;font-weight:bold}input,select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px}button{padding:9px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}.primary{border-color:var(--green);background:var(--green);color:#fff}.danger{color:var(--danger)}.member{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.member:last-child{border-bottom:0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{color:var(--green)}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.member{grid-template-columns:1fr}}</style></head><body><main><a href="admin-grupper.html">&larr; Grupper</a><h1 id="title">Henter gruppe...</h1><p class="meta" id="intro"></p><section class="panel"><h2>Tilføj medlem</h2><div class="toolbar"><label>Søg<input id="search" placeholder="Navn, firma eller e-mail"></label><label>Bruger<select id="candidate"></select></label><button class="primary" id="add">Tilføj</button></div><p class="notice" id="notice"></p></section><section class="panel"><h2>Medlemmer</h2><div id="members"></div></section></main><script src="portal-data.js?v=20260610-01"></script><script src="portal-header.js?v=20260610-01"></script><script>
var groupId=new URLSearchParams(location.search).get("id"),detail=null,allUsers=[];
function renderCandidates(){var memberIds=(detail.members||[]).map(function(m){return String(m.id)}),q=search.value.toLowerCase(),available=allUsers.filter(function(u){return!memberIds.includes(String(u.id))&&(u.email+" "+(u.profileName||"")+" "+(u.company||"")).toLowerCase().includes(q)});candidate.innerHTML=available.map(function(u){return'<option value="'+u.id+'">'+PortalData.escape((u.profileName?u.profileName+" · ":"")+u.email)+'</option>'}).join("")}
function render(){title.textContent=detail.group.name;intro.textContent=(detail.group.address||"")+" · "+detail.group.memberCount+" medlemmer";members.innerHTML=detail.members.length?detail.members.map(function(m){var profile=m.profileId?'<a href="partner-profil.html?id='+m.profileId+'">'+PortalData.escape(m.profileName||"Profil")+'</a>':'<span class="danger">Profil mangler</span>';return'<div class="member"><span><strong>'+PortalData.escape(m.profileName||m.email)+'</strong><br><span class="meta">'+PortalData.escape(m.company||"")+(m.company?" · ":"")+PortalData.escape(m.email)+' · '+PortalData.escape(m.role)+'</span><br>'+profile+'</span><span class="actions"><a href="admin-bruger.html?id='+m.id+'">Rediger bruger</a><button class="danger" data-remove="'+m.id+'">Fjern</button></span></div>'}).join(""):'<p class="meta">Gruppen har ingen medlemmer.</p>';document.querySelectorAll("[data-remove]").forEach(function(u){u.onclick=async function(){if(confirm("Fjern brugeren fra gruppen?")){await PortalData.changeGroupMember({groupId:groupId,userId:u.dataset.remove,operation:"remove"});load()}}});renderCandidates()}
function renderEditor(){var form=document.getElementById("group-edit");if(!form){form=document.createElement("form");form.id="group-edit";form.className="panel";form.innerHTML='<h2>Gruppeoplysninger</h2><div class="toolbar"><label>Navn<input name="name" required></label><label>Adresse<input name="address"></label><button class="primary">Gem</button></div><p class="notice"></p>';document.querySelector("main").insertBefore(form,document.querySelector("main .panel"));form.onsubmit=async function(e){e.preventDefault();var message=form.querySelector(".notice");try{await PortalData.updateGroup({groupId:groupId,name:form.elements.name.value,address:form.elements.address.value});message.textContent="Gruppen er gemt.";await load()}catch(x){message.textContent=x.message}}}form.elements.name.value=detail.group.name||"";form.elements.address.value=detail.group.address||""}
async function load(){detail=await PortalData.groupDetail(groupId);if(!detail.group)throw new Error("Gruppen findes ikke.");renderEditor();render()}
PortalData.requireSession("admin").then(async function(){allUsers=(await PortalData.adminUsers({page:1,pageSize:500})).users;load()}).catch(function(x){intro.textContent=x.message});
search.oninput=renderCandidates;add.onclick=async function(){if(!candidate.value)return;await PortalData.changeGroupMember({groupId:groupId,userId:candidate.value,operation:"add"});notice.textContent="Medlemmet er tilføjet.";load()};
</script></body></html>

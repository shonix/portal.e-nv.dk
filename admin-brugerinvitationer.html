<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Brugerinvitationer | Administration</title><link rel="stylesheet" href="portal-header.css?v=20260717-01"><style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--danger:#a12626}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:900px;margin:auto;padding:40px 20px 64px}a{color:var(--green)}h1{margin:10px 0 6px}.intro,.meta{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.panel,.item{padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}.item{margin-top:10px}label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px}button{margin-top:16px;padding:10px 14px;border:0;border-radius:5px;background:var(--green);color:#fff}.notice{color:var(--green);overflow-wrap:anywhere}.warning{color:var(--danger)}@media(max-width:900px){main{width:100%;max-width:100%;padding:28px 16px 48px!important;overflow-x:hidden}.grid{width:100%;max-width:100%;min-width:0;grid-template-columns:1fr}.panel,.item{width:100%;max-width:100%;min-width:0;padding:16px}.notice a{overflow-wrap:anywhere}}</style></head><body><main><a href="admin.html">&larr; Administration</a><h1>Brugerinvitationer</h1><p class="intro">Opret en ny brugerkonto via et personligt engangslink. Mødeinvitationer håndteres på deres egen side.</p><div class="grid"><form class="panel" id="form"><h2>Ny brugerinvitation</h2><label>E-mail<input name="email" type="email" required></label><button>Opret og send invitation</button><p class="notice" id="notice"></p></form><section class="panel"><h2>Seneste invitationer</h2><div id="list"></div></section></div></main><script src="portal-data.js?v=20260610-01"></script><script src="portal-header.js?v=20260717-04"></script><script>
function invitationLink(url){return url?'<a href="'+PortalData.escape(url)+'" target="_blank" rel="noopener">'+PortalData.escape(url)+'</a>':'<span class="warning">Linket kan ikke vises for denne ældre invitation.</span>'}
async function load(){var rows=await PortalData.invitations();list.innerHTML=rows.length?rows.map(function(x){return'<div class="item"><strong>'+PortalData.escape(x.email)+'</strong><p class="meta">'+(x.usedAt?"Brugt":"Ikke brugt")+' · Udløber '+PortalData.escape(x.expiresAt)+'</p><p class="notice">'+invitationLink(x.url)+'</p></div>'}).join(""):'<p class="meta">Ingen invitationer endnu.</p>'}
PortalData.requireSession("admin").then(load);form.onsubmit=async function(e){e.preventDefault();try{var x=await PortalData.addInvitation(Object.fromEntries(new FormData(form))),message=x.invitation.emailSent?"Invitationen er oprettet og sendt.":"Invitationen er oprettet. E-mailen kunne ikke sendes automatisk.";notice.className=x.invitation.emailSent?"notice":"notice warning";notice.innerHTML=PortalData.escape(message)+'<br>'+invitationLink(x.invitation.url);form.reset();load()}catch(x){notice.className="notice warning";notice.textContent=x.message}};
</script></body></html>

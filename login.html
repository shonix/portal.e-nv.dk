<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log ind | Partnerportal</title>
  <link rel="stylesheet" href="portal-header.css?v=20260717-01">
  <style>
    :root { --navy:#15243a; --green:#163674; --line:#d6dde3; --muted:#5d6b80; --page:#f5f7f9; --surface:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--navy); font-family:Arial,Helvetica,sans-serif; }
    main { max-width:460px; margin:8vh auto; padding:24px; }
    .panel { padding:26px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    h1 { margin:0 0 8px; font-size:30px; }
    p { color:var(--muted); line-height:1.5; }
    label { display:block; margin-top:14px; color:var(--muted); font-size:13px; font-weight:bold; }
    input { width:100%; margin-top:5px; padding:11px; border:1px solid var(--line); border-radius:5px; font:inherit; }
    button { width:100%; margin-top:18px; padding:11px; border:0; border-radius:5px; background:var(--green); color:#fff; cursor:pointer; font:inherit; font-weight:bold; }
    .error { display:none; color:#a12626; }
  </style>
</head>
<body>
  <main>
    <form class="panel" id="login-form">
      <h1>Log ind</h1>
      <p>Log ind for at administrere partnerportalen.</p>
      <label>E-mail<input name="email" type="email" required autocomplete="username"></label>
      <label>Adgangskode<input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Log ind</button>
      <p class="error" id="error"></p>
    </form>
  </main>
  <script src="portal-data.js?v=20260604-02"></script><script src="portal-header.js?v=20260717-04"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      var error = document.getElementById("error");
      error.style.display = "none";
      try {
        var session = await PortalData.login(event.target.email.value, event.target.password.value);
        var next = new URLSearchParams(location.search).get("next");
        location.href = next && /^[A-Za-z0-9._-]+\.html(?:\?[^#]*)?$/.test(next)
          ? next
          : (session.role === "admin" ? "admin.html" : "index.html");
      } catch (problem) {
        error.textContent = problem.message;
        error.style.display = "block";
      }
    });
  </script>
</body>
</html>

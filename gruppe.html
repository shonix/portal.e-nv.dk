<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gruppe | Partnerportal</title><link rel="stylesheet" href="portal-header.css?v=20260604-03">
<style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--surface:#fff}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:1180px;margin:auto;padding:42px 24px 64px}a{color:var(--green);text-underline-offset:3px}.eyebrow{margin:28px 0 6px;color:var(--muted);font-size:13px;font-weight:bold;text-transform:uppercase}h1{margin:0 0 8px;font-size:36px}.intro{color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;text-decoration:none}.card:hover{box-shadow:0 6px 18px #0001;transform:translateY(-2px)}.avatar{display:flex;width:56px;height:56px;align-items:center;justify-content:center;border-radius:50%;background:var(--green);color:#fff;font-size:24px;font-weight:bold}h2{margin:0 0 4px;color:var(--green);font-size:20px}.card p{margin:4px 0;color:var(--muted)}.labels{color:var(--green)!important;font-size:13px;font-weight:bold}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><a href="index.html">&larr; Partnerportal</a><p class="eyebrow">Netv&aelig;rksgruppe</p><h1 id="title">Henter gruppe...</h1><p class="intro" id="intro"></p><section class="grid" id="grid"></section></main><script src="portal-data.js?v=20260604-02"></script><script src="portal-header.js?v=20260604-02"></script><script>
var id=new URLSearchParams(location.search).get("id");
PortalData.requireSession().then(function(){return PortalData.groupPartners(id)}).then(function(data){if(!data.group)throw new Error("Gruppen findes ikke.");title.textContent=data.group.name;intro.textContent=(data.group.address||"")+" \u00b7 "+data.group.memberCount+" medlemmer";grid.innerHTML=data.partners.length?data.partners.map(function(p){return'<a class="card" href="partner-profil.html?id='+encodeURIComponent(p.id)+'&groupId='+encodeURIComponent(id)+'"><span class="avatar">'+PortalData.escape(p.name.charAt(0))+'</span><span><h2>'+PortalData.escape(p.name)+'</h2>'+(p.company?'<p>'+PortalData.escape(p.company)+'</p>':'')+'<p class="labels">'+PortalData.escape(p.labels||"")+'</p></span></a>'}).join(""):"<p>Der er endnu ingen partnerprofiler i gruppen.</p>"}).catch(function(x){title.textContent="Gruppen kunne ikke hentes";intro.textContent=x.message});
</script></body></html>

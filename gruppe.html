<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gruppe | Partnerportal</title><link rel="stylesheet" href="portal-header.css?v=20260717-01">
<style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--surface:#fff}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:1180px;margin:auto;padding:42px 24px 64px}a{color:var(--green);text-underline-offset:3px}.eyebrow{margin:28px 0 6px;color:var(--muted);font-size:13px;font-weight:bold;text-transform:uppercase}h1{margin:0 0 8px;font-size:36px}.intro{color:var(--muted);margin:0 0 18px}.bulletin-board{margin:0 0 24px;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.bulletin-board h2{margin:0 0 12px;color:var(--navy);font-size:22px}.bulletin{padding:13px 0;border-top:1px solid var(--line)}.bulletin:first-of-type{border-top:0}.bulletin p{margin:4px 0 0;white-space:pre-line;color:var(--navy);line-height:1.5}.filter{max-width:520px;margin:0 0 24px}.filter label{display:block;color:var(--muted);font-size:13px;font-weight:bold}.filter input{width:100%;margin-top:6px;padding:12px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--navy);font:inherit}.filter input:focus{outline:2px solid #16367422;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;text-decoration:none}.card:hover{box-shadow:0 6px 18px #0001;transform:translateY(-2px)}.avatar{display:flex;width:56px;height:56px;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;background:var(--green);color:#fff;font-size:24px;font-weight:bold}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}h2{margin:0 0 4px;color:var(--green);font-size:20px}.card p{margin:4px 0;color:var(--muted)}.labels{color:var(--green)!important;font-size:13px;font-weight:bold}.empty{color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.filter{max-width:none}}</style></head>
<body><main><a href="index.html">&larr; Partnerportal</a><p class="eyebrow">Netværksgruppe</p><h1 id="title">Henter gruppe...</h1><p class="intro" id="intro"></p><section class="bulletin-board" id="bulletin-board" hidden><h2>Opslagstavle</h2><div id="bulletins"></div></section><div class="filter" id="filter" hidden><label>Søg i gruppen<input id="search" type="search" placeholder="Søg på branche, navn eller virksomhed" autocomplete="off"></label></div><section class="grid" id="grid"></section></main><script src="portal-data.js?v=20260604-02"></script><script src="portal-header.js?v=20260717-04"></script><script>
var id=new URLSearchParams(location.search).get("id"),partners=[],searchInput=document.getElementById("search"),filterBox=document.getElementById("filter"),bulletinBoard=document.getElementById("bulletin-board");
function formatDate(value){return value?new Date(value).toLocaleString("da-DK",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):""}
function partnerCard(p){var avatar=p.profileImageUrl?'<img src="'+PortalData.escape(p.profileImageUrl)+'" alt="">':PortalData.escape((p.name||"?").charAt(0));return'<a class="card" href="partner-profil.html?id='+encodeURIComponent(p.id)+'&groupId='+encodeURIComponent(id)+'"><span class="avatar">'+avatar+'</span><span><h2>'+PortalData.escape(p.name||"")+'</h2>'+(p.company?'<p>'+PortalData.escape(p.company)+'</p>':'')+'<p class="labels">'+PortalData.escape(p.labels||"")+'</p></span></a>'}
function renderPartners(){var query=searchInput.value.trim().toLowerCase(),visible=partners.filter(function(p){return !query||[p.labels,p.name,p.company].join(" ").toLowerCase().includes(query)});grid.innerHTML=visible.length?visible.map(partnerCard).join(""):'<p class="empty">'+(partners.length?"Ingen profiler matcher søgningen.":"Der er endnu ingen partnerprofiler i gruppen.")+'</p>'}
function renderBulletins(rows){bulletinBoard.hidden=false;bulletins.innerHTML=rows.length?rows.map(function(b){var sender=b.createdByName||b.createdByEmail||"Ukendt afsender";return'<article class="bulletin"><span class="empty">'+PortalData.escape(formatDate(b.createdAt))+' · Afsender: '+PortalData.escape(sender)+'</span><p>'+PortalData.escape(b.message)+'</p></article>'}).join(""):'<p class="empty">Der er ingen opslag endnu.</p>'}
searchInput.addEventListener("input",renderPartners);
PortalData.requireSession().then(function(){return Promise.all([PortalData.groupPartners(id),PortalData.groupBulletins(id)])}).then(function(results){var data=results[0];if(!data.group)throw new Error("Gruppen findes ikke.");partners=data.partners||[];title.textContent=data.group.name;intro.textContent=data.group.address||"";filterBox.hidden=!partners.length;renderBulletins(results[1]||[]);renderPartners()}).catch(function(x){title.textContent="Gruppen kunne ikke hentes";intro.textContent=x.message});
</script></body></html>

<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gruppe | Partnerportalen</title><link rel="stylesheet" href="portal-header.css?v=20260717-01">
<style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--surface:#fff;--success:#237044;--success-soft:#edf8f1;--danger:#a12626;--danger-soft:#fdf1f1}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:1180px;margin:auto;padding:42px 24px 64px}a{color:var(--green);text-underline-offset:3px}.group-hero{width:100%;margin:22px 0 0;overflow:hidden;border-radius:14px;background:#dce4ef;box-shadow:0 7px 22px #15243a18}.group-hero img{display:block;width:100%;max-height:430px;aspect-ratio:16/6.5;object-fit:cover}.eyebrow{margin:28px 0 6px;color:var(--muted);font-size:13px;font-weight:bold;text-transform:uppercase}h1{margin:0 0 8px;font-size:36px}.intro{color:var(--muted);margin:0 0 8px}.group-description{max-width:780px;margin:0 0 24px;color:#445169;line-height:1.65;white-space:pre-line}.bulletin-board,.members-board{margin:0 0 24px;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.bulletin-board h2,.members-board h2{margin:0 0 12px;color:var(--navy);font-size:22px}.bulletin{padding:13px 0;border-top:1px solid var(--line)}.bulletin:first-of-type{border-top:0}.bulletin p{margin:4px 0 0;white-space:pre-line;color:var(--navy);line-height:1.5}.industry-board{margin:26px 0 0;padding-top:24px;border-top:1px solid var(--line)}.industry-board>h2{margin-bottom:5px}.industry-intro{margin:0 0 17px;color:var(--muted);line-height:1.5}.industry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.industry-column{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff}.industry-header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.industry-header h3{margin:0;font-size:16px}.industry-count{display:inline-flex;min-width:34px;height:28px;padding:0 9px;align-items:center;justify-content:center;border-radius:999px;font-size:13px;font-weight:bold}.industry-column.present .industry-header{background:var(--success-soft)}.industry-column.present h3,.industry-column.present .industry-count{color:var(--success)}.industry-column.present .industry-count{background:#d9efdf}.industry-column.missing .industry-header{background:var(--danger-soft)}.industry-column.missing h3,.industry-column.missing .industry-count{color:var(--danger)}.industry-column.missing .industry-count{background:#f6dede}.industry-list{height:300px;overflow-x:hidden;overflow-y:auto;scrollbar-gutter:stable;padding:6px 17px}.industry-item{display:flex;gap:10px;align-items:center;min-height:42px;padding:9px 0;border-bottom:1px solid #e8ecf0;line-height:1.35}.industry-item:last-child{border-bottom:0}.industry-item:before{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--green);content:""}.industry-column.present .industry-item:before{background:var(--success)}.industry-column.missing .industry-item:before{background:var(--danger)}.industry-empty{margin:0;padding:17px 0;color:var(--muted);line-height:1.5}.filter{max-width:520px;margin:0 0 24px}.filter label{display:block;color:var(--muted);font-size:13px;font-weight:bold}.filter input{width:100%;margin-top:6px;padding:12px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--navy);font:inherit}.filter input:focus{outline:2px solid #16367422;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;text-decoration:none}.card:hover{box-shadow:0 6px 18px #0001;transform:translateY(-2px)}.avatar{display:flex;width:56px;height:56px;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;background:var(--green);color:#fff;font-size:24px;font-weight:bold}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}h2{margin:0 0 4px;color:var(--green);font-size:20px}.card p{margin:4px 0;color:var(--muted)}.labels{color:var(--green)!important;font-size:13px;font-weight:bold}.empty{color:var(--muted)}[hidden]{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.industry-grid{grid-template-columns:1fr}.industry-list{height:230px}}@media(max-width:560px){main{padding:28px 16px 48px}.group-hero img{aspect-ratio:16/9}.grid{grid-template-columns:1fr}.filter{max-width:none}}</style></head>
<body><main><a href="index.html">&larr; Partnerportalen</a><div class="group-hero" id="group-hero" hidden><img id="group-cover" alt=""></div><p class="eyebrow">Netværksgruppe</p><h1 id="title">Henter gruppe...</h1><p class="intro" id="intro"></p><p class="group-description" id="group-description" hidden></p><section class="bulletin-board" id="bulletin-board" hidden><h2>Opslagstavle</h2><div id="bulletins"></div></section><section class="members-board"><h2>Medlemmer</h2><div class="filter" id="filter" hidden><label>Søg i gruppen<input id="search" type="search" placeholder="Søg på branche, navn eller virksomhed" autocomplete="off"></label></div><section class="grid" id="grid"></section><section class="industry-board" id="industry-board"><h2>Brancheoverblik</h2><p class="industry-intro">Se hvilke brancher der allerede er repræsenteret, og hvor gruppen stadig har plads til nye kompetencer.</p><div class="industry-grid"><section class="industry-column present"><header class="industry-header"><h3>Brancher i gruppen</h3><span class="industry-count" id="represented-count">0</span></header><div class="industry-list" id="represented-labels"></div></section><section class="industry-column missing"><header class="industry-header"><h3>Brancher der mangler</h3><span class="industry-count" id="missing-count">0</span></header><div class="industry-list" id="missing-labels"></div></section></div></section></section></main><script src="portal-data.js?v=20261013-03"></script><script src="portal-header.js?v=20260811-04"></script><script>
var id=new URLSearchParams(location.search).get("id"),partners=[],searchInput=document.getElementById("search"),filterBox=document.getElementById("filter"),bulletinBoard=document.getElementById("bulletin-board");
function formatDate(value){return value?new Date(value).toLocaleString("da-DK",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):""}
function partnerCard(p){var avatar=p.profileImageUrl?'<img src="'+PortalData.escape(p.profileImageUrl)+'" alt="">':PortalData.escape((p.name||"?").charAt(0));return'<a class="card" href="partner-profil.html?id='+encodeURIComponent(p.id)+'&groupId='+encodeURIComponent(id)+'"><span class="avatar">'+avatar+'</span><span><h2>'+PortalData.escape(p.name||"")+'</h2>'+(p.company?'<p>'+PortalData.escape(p.company)+'</p>':'')+'<p class="labels">'+PortalData.escape(p.labels||"")+'</p></span></a>'}
function renderPartners(){var query=searchInput.value.trim().toLowerCase(),visible=partners.filter(function(p){return !query||[p.labels,p.name,p.company].join(" ").toLowerCase().includes(query)});grid.innerHTML=visible.length?visible.map(partnerCard).join(""):'<p class="empty">'+(partners.length?"Ingen profiler matcher søgningen.":"Der er endnu ingen partnerprofiler i gruppen.")+'</p>'}
function renderBulletins(rows){bulletinBoard.hidden=false;bulletins.innerHTML=rows.length?rows.map(function(b){var sender=b.createdByName||b.createdByEmail||"Ukendt afsender";return'<article class="bulletin"><span class="empty">'+PortalData.escape(formatDate(b.createdAt))+' · Afsender: '+PortalData.escape(sender)+'</span><p>'+PortalData.escape(b.message)+'</p></article>'}).join(""):'<p class="empty">Der er ingen opslag endnu.</p>'}
function renderIndustryList(targetId,rows,emptyText){document.getElementById(targetId).innerHTML=rows.length?rows.map(function(label){return'<div class="industry-item">'+PortalData.escape(label.name)+'</div>'}).join(""):'<p class="industry-empty">'+PortalData.escape(emptyText)+'</p>'}
function renderIndustryOverview(represented,missing){represented=represented||[];missing=missing||[];document.getElementById("represented-count").textContent=represented.length;document.getElementById("missing-count").textContent=missing.length;renderIndustryList("represented-labels",represented,"Ingen brancher er repræsenteret endnu.");renderIndustryList("missing-labels",missing,"Alle oprettede brancher er repræsenteret i gruppen.")}
searchInput.addEventListener("input",renderPartners);
PortalData.requireSession().then(function(){return PortalData.groupPartners(id)}).then(function(data){if(!data.group)throw new Error("Gruppen findes ikke.");partners=data.partners||[];title.textContent=data.group.name;intro.textContent=data.group.address||"";var description=document.getElementById("group-description"),hero=document.getElementById("group-hero"),cover=document.getElementById("group-cover");if(data.group.description){description.textContent=data.group.description;description.hidden=false}if(data.group.coverImageUrl){cover.src=data.group.coverImageUrl;cover.alt="Gruppebillede for "+data.group.name;hero.hidden=false}filterBox.hidden=!partners.length;renderIndustryOverview(data.representedLabels,data.missingLabels);renderPartners();PortalData.groupBulletins(id).then(renderBulletins).catch(function(){bulletinBoard.hidden=false;bulletins.innerHTML='<p class="empty">Opslagstavlen kunne ikke hentes.</p>'})}).catch(function(x){title.textContent="Gruppen kunne ikke hentes";intro.textContent=x.message});
</script></body></html>

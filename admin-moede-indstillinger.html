<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mødeindstillinger | Administration</title><link rel="stylesheet" href="portal-header.css?v=20260610-01"><style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--danger:#a12626}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:850px;margin:auto;padding:40px 24px 64px}a{color:var(--green)}h1{margin:10px 0 6px}.meta{color:var(--muted)}.panel{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}input,select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px}button{padding:9px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}.primary{border-color:var(--green);background:var(--green);color:#fff}.danger{color:var(--danger)}.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.notice{color:var(--green)}.attachment{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.attachment:last-child{border-bottom:0}</style></head><body><main><a href="admin-moeder-oversigt.html">&larr; Møder</a><h1 id="title">Mødeindstillinger</h1><p class="meta" id="intro"></p><form class="panel" id="settings"><h2>Tilmeldingsgodkendelse</h2><label>Godkendelse<select name="approvalMode"><option value="automatic">Automatisk bekræftelse</option><option value="manual">Godkendes af administrator</option></select></label><button class="primary">Gem indstilling</button><p class="notice" id="settings-notice"></p></form><form class="panel" id="upload"><h2>Private filer og billeder</h2><label>Fil<input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.docx,.xlsx" required></label><p class="meta">Maks. 10 MB. Filerne kan åbnes af administratorer og mødedeltagere med adgang.</p><button class="primary">Upload</button><p class="notice" id="upload-notice"></p></form><section class="panel"><h2>Vedhæftninger</h2><div id="attachments"></div></section></main><script src="portal-data.js?v=20260610-01"></script><script src="portal-header.js?v=20260610-01"></script><script>
var meetingId=new URLSearchParams(location.search).get("id"),meetingRow=null;
function bytes(n){if(n<1024)return n+" B";if(n<1048576)return Math.round(n/1024)+" KB";return(Math.round(n/104857.6)/10)+" MB"}
async function loadAttachments(){var rows=await PortalData.meetingAttachments(meetingId);attachments.innerHTML=rows.length?rows.map(function(a){var base='api/index.php?action=admin-download-attachment&attachmentId='+a.id;return'<div class="attachment"><span><strong>'+PortalData.escape(a.name)+'</strong><br><span class="meta">'+bytes(a.size)+' · '+PortalData.escape(a.mimeType)+'</span></span><span class="button-row"><a href="'+base+'&preview=1" target="_blank">Vis</a><a href="'+base+'">Download</a><button class="danger" data-delete="'+a.id+'">Slet</button></span></div>'}).join(""):'<p class="meta">Ingen vedhæftninger.</p>';document.querySelectorAll("[data-delete]").forEach(function(u){u.onclick=async function(){if(confirm("Slet filen?")){await PortalData.deleteMeetingAttachment(u.dataset.delete);loadAttachments()}}})}
PortalData.requireSession("admin").then(async function(){var rows=await PortalData.meetings();meetingRow=rows.find(function(m){return String(m.id)===String(meetingId)});if(!meetingRow)throw new Error("Mødet findes ikke.");title.textContent=meetingRow.title;intro.textContent=meetingRow.date+" kl. "+meetingRow.time;settings.elements.approvalMode.value=meetingRow.approvalMode||"automatic";loadAttachments()}).catch(function(x){intro.textContent=x.message});
settings.onsubmit=async function(e){e.preventDefault();var notice=document.getElementById("settings-notice"),r=await PortalData.saveMeetingSettings(meetingId,settings.elements.approvalMode.value);notice.textContent=r.approvalMode==="manual"?"Manuel godkendelse er valgt.":"Automatisk godkendelse er valgt."};
upload.onsubmit=async function(e){e.preventDefault();var notice=document.getElementById("upload-notice");try{await PortalData.uploadMeetingAttachment(meetingId,upload.elements.file.files[0]);upload.reset();notice.textContent="Filen er uploadet.";loadAttachments()}catch(x){notice.textContent=x.message}};
</script></body></html>

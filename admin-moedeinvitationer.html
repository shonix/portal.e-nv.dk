<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mødeinvitationer | Administration</title><link rel="stylesheet" href="portal-header.css?v=20260610-01"><style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--danger:#a12626}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px 64px}a{color:var(--green)}h1{margin:10px 0 6px}.intro,.meta{color:var(--muted)}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}.panel{padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}select,input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px}.checks{display:grid;gap:8px;max-height:220px;overflow:auto;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:5px}.checks label{display:flex;gap:8px;margin:0;color:var(--navy);font-weight:normal}.checks input{width:auto;margin:0}.button-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button{padding:9px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}.primary{border-color:var(--green);background:var(--green);color:#fff}.danger,.bad{color:var(--danger)}.notice{color:var(--green);overflow-wrap:anywhere}.recipient{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.recipient:last-child{border-bottom:0}.status{font-size:12px;font-weight:bold;text-transform:uppercase}@media(max-width:850px){.layout{grid-template-columns:1fr}}</style></head><body><main><a href="admin.html">&larr; Administration</a><h1>Mødeinvitationer</h1><p class="intro">Vælg et møde og send det samme invitationslink til valgte grupper og brugere.</p><div class="layout"><form class="panel" id="send-form"><label>Møde<select name="meetingId" id="meeting"></select></label><h2>Grupper</h2><div class="checks" id="groups"></div><h2>Enkeltpersoner</h2><label>Søg<input id="user-search" placeholder="Søg efter navn eller e-mail"></label><div class="checks" id="users"></div><button class="primary">Send invitationer</button><p class="notice" id="notice"></p></form><section class="panel"><h2>Status</h2><div id="summary"><p class="meta">Vælg et møde.</p></div><div id="recipients"></div></section></div></main><script src="portal-data.js?v=20260610-01"></script><script src="portal-header.js?v=20260610-01"></script><script>
var meetingRows=[],groupRows=[],userRows=[];
function checks(rows,name,label){return rows.map(function(x){return'<label><input type="checkbox" name="'+name+'" value="'+x.id+'"> '+PortalData.escape(label(x))+'</label>'}).join("")}
function renderUsers(filter){filter=(filter||"").toLowerCase();var visible=userRows.filter(function(u){return(u.email+" "+(u.profileName||"")).toLowerCase().includes(filter)});users.innerHTML=checks(visible,"userIds",function(u){return(u.profileName?u.profileName+" · ":"")+u.email})||'<span class="meta">Ingen brugere fundet.</span>'}
async function loadStatus(){var id=meeting.value;if(!id)return;var data=await PortalData.meetingInvitations(id),m=data.meeting;summary.innerHTML='<p><strong>'+PortalData.escape(m.title)+'</strong></p><p class="meta">Godkendelse: '+(m.approvalMode==="manual"?"Manuel":"Automatisk")+'</p><p class="notice">'+(m.url?'<a href="'+PortalData.escape(m.url)+'" target="_blank">'+PortalData.escape(m.url)+'</a>':'Linket oprettes ved første udsendelse.')+'</p>'+(m.url?'<button type="button" class="danger" id="rotate">Opret nyt link</button>':'');if(m.url)document.getElementById("rotate").onclick=async function(){if(confirm("Det gamle link stopper med at virke. Opret nyt link?")){await PortalData.rotateMeetingInvitation(id);loadStatus()}};recipients.innerHTML=data.recipients.length?data.recipients.map(function(r){var response=r.response==="attending"?"Deltager":r.response==="not_attending"?"Deltager ikke":"Intet svar",approval=r.approvalStatus==="pending"?"Afventer":r.approvalStatus==="confirmed"?"Godkendt":r.approvalStatus==="declined"?"Afvist":"",review=r.approvalStatus==="pending"?'<div class="button-row"><button data-review="confirmed" data-user="'+r.userId+'">Godkend</button><button data-review="declined" data-user="'+r.userId+'">Afvis</button></div>':"";return'<div class="recipient"><span><strong>'+PortalData.escape(r.name||r.email)+'</strong><br><span class="meta">'+PortalData.escape(r.email)+' · '+response+(approval?" · "+approval:"")+'</span><br><span class="'+(r.emailStatus==="failed"?"bad":"meta")+'">E-mail: '+PortalData.escape(r.emailStatus||"pending")+(r.emailError?" · "+PortalData.escape(r.emailError):"")+'</span>'+review+'</span><span class="status">'+PortalData.escape(r.approvalStatus||"")+'</span></div>'}).join(""):'<p class="meta">Ingen invitationer er sendt endnu.</p>';document.querySelectorAll("[data-review]").forEach(function(b){b.onclick=async function(){await PortalData.reviewRsvp({meetingId:id,userId:b.dataset.user,approvalStatus:b.dataset.review});loadStatus()}})}
PortalData.requireSession("admin").then(async function(){meetingRows=await PortalData.meetings();groupRows=await PortalData.groups();userRows=(await PortalData.adminUsers({page:1,pageSize:500})).users;meeting.innerHTML=meetingRows.map(function(m){return'<option value="'+m.id+'">'+PortalData.escape(m.title)+' · '+PortalData.escape(m.date)+'</option>'}).join("");groups.innerHTML=checks(groupRows,"groupIds",function(g){return g.name});renderUsers("");loadStatus()});
meeting.onchange=loadStatus;document.getElementById("user-search").oninput=function(){renderUsers(this.value)};
document.getElementById("send-form").onsubmit=async function(e){e.preventDefault();var data={meetingId:meeting.value,groupIds:Array.from(document.querySelectorAll('[name=groupIds]:checked')).map(function(x){return x.value}),userIds:Array.from(document.querySelectorAll('[name=userIds]:checked')).map(function(x){return x.value})};try{var result=await PortalData.sendMeetingInvitations(data),sent=result.results.filter(function(x){return x.sent}).length;notice.textContent=sent+" af "+result.results.length+" invitationer blev sendt.";loadStatus()}catch(x){notice.textContent=x.message}};
</script></body></html>

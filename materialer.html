<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Materiale til partnere | Partnerportal</title>
  <link rel="stylesheet" href="portal-header.css?v=20260717-01">
  <style>
    :root{--navy:#15243a;--blue:#163674;--red:#c92b2b;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--surface:#fff;--soft:#eef3f8}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:980px;margin:auto;padding:40px 24px 64px}a{color:var(--blue);text-underline-offset:3px}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px}.admin-link[hidden]{display:none}h1{margin:22px 0 7px;font-size:34px}.intro{max-width:680px;margin:0;color:var(--muted);line-height:1.5}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:28px 0 14px}.toolbar h2{margin:0;font-size:21px}.filter-label{display:grid;gap:6px;color:var(--muted);font-size:13px;font-weight:bold}.filter-label select{min-width:190px;min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--navy);font:inherit}.material-list{display:grid;gap:10px}.material{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.material-copy{min-width:0}.category{display:inline-block;margin-bottom:7px;padding:4px 7px;border-radius:4px;background:var(--soft);color:var(--blue);font-size:11px;font-weight:bold;text-transform:uppercase}.material h3{margin:0 0 5px;font-size:18px}.description{margin:0 0 8px;color:var(--muted);line-height:1.45;white-space:pre-wrap}.meta{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.download{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 14px;border:1px solid var(--blue);border-radius:5px;background:var(--blue);color:#fff;text-decoration:none;font-weight:bold;white-space:nowrap}.empty{margin:0;padding:34px 20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}.status{color:var(--muted)}@media(max-width:700px){main{padding:28px 16px 48px}.topline{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.filter-label select{width:100%}.material{grid-template-columns:1fr;padding:16px}.download{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="topline">
      <a href="index.html">&larr; Partnerportal</a>
      <a class="admin-link" id="admin-link" href="admin-materialer.html" hidden>Administrer materiale</a>
    </div>
    <h1>Materiale til partnere</h1>
    <p class="intro">Hent logoer, grafikker, materiale til e-mailsignaturer og officielle flyers.</p>

    <div class="toolbar">
      <h2>Filer</h2>
      <label class="filter-label">Kategori
        <select id="category-filter">
          <option value="">Alle kategorier</option>
          <option value="logo">Logoer</option>
          <option value="email_signature">E-mailsignatur</option>
          <option value="web">Hjemmeside og grafik</option>
          <option value="flyer">Flyers</option>
          <option value="other">Andet</option>
        </select>
      </label>
    </div>

    <p class="status" id="status" role="status">Henter materiale...</p>
    <div class="material-list" id="material-list"></div>
  </main>

  <script src="portal-data.js?v=20260811-02"></script>
  <script src="portal-header.js?v=20260811-04"></script>
  <script>
    var materials=[],categoryLabels={logo:"Logo",email_signature:"E-mailsignatur",web:"Hjemmeside og grafik",flyer:"Flyer",other:"Andet"};
    var list=document.getElementById("material-list"),statusText=document.getElementById("status"),filter=document.getElementById("category-filter");
    function fileSize(bytes){if(bytes<1024)return bytes+" B";if(bytes<1048576)return (bytes/1024).toFixed(bytes<10240?1:0)+" KB";return (bytes/1048576).toFixed(1)+" MB"}
    function render(){var selected=filter.value,visible=materials.filter(function(item){return !selected||item.category===selected});statusText.hidden=true;if(!visible.length){list.innerHTML='<p class="empty">'+(materials.length?'Der er ingen filer i denne kategori.':'Der er endnu ikke uploadet materiale.')+'</p>';return}list.innerHTML=visible.map(function(item){return '<article class="material"><div class="material-copy"><span class="category">'+PortalData.escape(categoryLabels[item.category]||"Andet")+'</span><h3>'+PortalData.escape(item.title)+'</h3>'+(item.description?'<p class="description">'+PortalData.escape(item.description)+'</p>':'')+'<p class="meta">'+PortalData.escape(item.originalName)+' &middot; '+PortalData.escape(fileSize(Number(item.size)||0))+'</p></div><a class="download" href="api/index.php?action=partner-material-download&amp;materialId='+encodeURIComponent(item.id)+'"><span aria-hidden="true">&#8595;</span> Hent fil</a></article>'}).join("")}
    filter.addEventListener("change",render);
    PortalData.requireSession().then(function(session){document.getElementById("admin-link").hidden=session.role!=="admin";return PortalData.partnerMaterials()}).then(function(items){materials=items;render()}).catch(function(error){statusText.hidden=false;statusText.textContent=error.message});
  </script>
</body>
</html>

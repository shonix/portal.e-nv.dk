<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Opret moede | Administration</title>
  <style>
    :root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial}
    main{max-width:800px;margin:auto;padding:40px 20px}a{color:var(--green)}
    form{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}
    label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}
    input,select,textarea{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px}
    select[multiple]{min-height:118px}textarea{min-height:70px}
    .hint{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:normal}
    button{margin-top:16px;padding:10px 14px;border:0;border-radius:5px;background:var(--green);color:#fff}
    .notice{color:var(--green)}
  </style>
</head>
<body>
<main>
  <a href="admin.html">&larr; Administration</a>
  <h1>Opret moede</h1>
  <form id="form">
    <label>Titel<input name="title" required></label>
    <label>Grupper
      <select name="groupIds" id="groups" multiple size="5"></select>
      <span class="hint">Hold Ctrl eller Cmd nede for at vaelge flere grupper.</span>
    </label>
    <label>Dato<input name="date" type="date" required></label>
    <label>Tidspunkt<input name="time" type="time" required></label>
    <label>Adresse<input name="address" required></label>
    <label>Status<select name="status"><option value="upcoming">Kommende</option><option value="held">Afholdt</option><option value="cancelled">Aflyst</option></select></label>
    <label>Partnere<textarea name="partners"></textarea></label>
    <label>Program<textarea name="program"></textarea></label>
    <label>Lokation<input name="location"></label>
    <label>Filer<input name="files"></label>
    <label>Gaester<input name="guests"></label>
    <label>Invitationslink<input name="invite"></label>
    <button>Opret moede</button>
    <p class="notice" id="notice"></p>
  </form>
</main>
<script src="portal-data.js?v=20260604-02"></script>
<script src="portal-header.js?v=20260604-02"></script>
<script>
function payload(form){var data=Object.fromEntries(new FormData(form));data.groupIds=Array.from(form.querySelectorAll('[name=groupIds] option:checked')).map(function(x){return x.value});return data}
PortalData.requireSession("admin").then(async function(){var items=await PortalData.groups();groups.innerHTML=items.map(function(g){return'<option value="'+g.id+'">'+PortalData.escape(g.name)+'</option>'}).join("")});
form.onsubmit=async function(e){e.preventDefault();try{await PortalData.addMeeting(payload(form));form.reset();notice.textContent="Moedet er oprettet."}catch(x){notice.textContent=x.message}};
</script>
</body>
</html>

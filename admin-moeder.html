<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>M&oslash;der | Administration</title><style>:root{--navy:#15243a;--green:#087563;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial}main{max-width:800px;margin:auto;padding:40px 20px}a{color:var(--green)}form{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}input,select,textarea{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px}textarea{min-height:70px}button{margin-top:16px;padding:10px 14px;border:0;border-radius:5px;background:var(--green);color:#fff}.notice{color:var(--green)}</style></head><body><main><a href="admin.html">&larr; Administration</a><h1>Opret m&oslash;de</h1><form id="form"><label>Titel<input name="title" required></label><label>Gruppe<select name="groupId" id="groups"><option value="">Ingen bestemt gruppe</option></select></label><label>Dato<input name="date" type="date" required></label><label>Tidspunkt<input name="time" type="time" required></label><label>Adresse<input name="address" required></label><label>Status<select name="status"><option value="upcoming">Kommende</option><option value="held">Afholdt</option><option value="cancelled">Aflyst</option></select></label><label>Partnere<textarea name="partners"></textarea></label><label>Program<textarea name="program"></textarea></label><label>Lokation<input name="location"></label><label>Filer<input name="files"></label><label>G&aelig;ster<input name="guests"></label><label>Invitationslink<input name="invite"></label><button>Opret m&oslash;de</button><p class="notice" id="notice"></p></form></main><script src="portal-data.js?v=20260604-02"></script><script src="portal-header.js?v=20260604-02"></script><script>PortalData.requireSession("admin").then(async function(){var items=await PortalData.groups();groups.innerHTML+='<option value="">Ingen bestemt gruppe</option>'+items.map(function(g){return'<option value="'+g.id+'">'+PortalData.escape(g.name)+'</option>'}).join("")});form.onsubmit=async function(e){e.preventDefault();try{await PortalData.addMeeting(Object.fromEntries(new FormData(form)));form.reset();notice.textContent="M\u00f8det er oprettet."}catch(x){notice.textContent=x.message}};</script></body></html>

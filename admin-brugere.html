<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Brugere | Administration</title>
  <link rel="stylesheet" href="portal-header.css?v=20260604-03">
  <style>
    :root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--surface:#fff;--danger:#a12626}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}
    main{max-width:1120px;margin:auto;padding:40px 24px 64px}a{color:var(--green);text-underline-offset:3px}
    h1{margin:10px 0 6px;font-size:34px}.intro{margin:0 0 22px;color:var(--muted)}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}.panel{padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
    label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}input,select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px;background:#fff}
    .group-picker{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:5px}.group-picker select{margin-top:0}
    .selected-groups{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tag{display:inline-flex;gap:7px;align-items:center;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);font-size:13px}.tag button{min-height:auto;padding:0;border:0;color:var(--danger)}
    .button-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
    button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--navy);font:inherit;text-decoration:none;cursor:pointer}
    .primary{border-color:var(--green);background:var(--green);color:#fff}.notice{min-height:20px;color:var(--green)}
    .filters{display:grid;grid-template-columns:minmax(220px,1fr) 150px 180px auto;gap:10px;align-items:end;margin-bottom:12px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase}tr:last-child td{border-bottom:0}
    .meta{color:var(--muted);font-size:13px}.missing{color:var(--danger)}.pager{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px}.empty{padding:28px;color:var(--muted);text-align:center}
    @media(max-width:860px){.layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters button{width:100%}}@media(max-width:560px){main{padding:28px 16px 48px}.filters{grid-template-columns:1fr}.pager{align-items:stretch;flex-direction:column}.pager .button-row{margin-top:0}}
  </style>
</head>
<body>
<main>
  <a href="admin.html">&larr; Administration</a>
  <h1>Brugere</h1>
  <p class="intro">Opret brugere her. Redigering foregaar paa brugerens egen underside, saa listen er hurtig at scanne.</p>
  <div class="layout">
    <form class="panel" id="form">
      <h2>Opret bruger</h2>
      <label>E-mail<input name="email" type="email" required></label>
      <label>Midlertidig adgangskode<input name="password" type="password" minlength="10" required></label>
      <label>Rolle<select name="role"><option value="member">Medlem</option><option value="admin">Administrator</option></select></label>
      <label>Grupper
        <span class="group-picker"><select id="new-user-group"></select><button type="button" id="add-new-user-group">Tilfoej</button></span>
      </label>
      <div class="selected-groups" id="new-user-groups"></div>
      <button class="primary">Opret bruger</button>
      <p class="notice" id="notice"></p>
    </form>
    <section class="panel">
      <form class="filters" id="filters">
        <label>Soeg<input name="search" placeholder="E-mail, navn eller firma"></label>
        <label>Rolle<select name="role"><option value="">Alle roller</option><option value="member">Medlem</option><option value="admin">Administrator</option></select></label>
        <label>Gruppe<select name="groupId" id="group-filter"><option value="">Alle grupper</option></select></label>
        <button class="primary">Filtrer</button>
      </form>
      <div class="table-wrap" id="table-wrap"><div class="empty">Henter brugere...</div></div>
      <div class="pager"><span class="meta" id="count"></span><div class="button-row"><button type="button" id="prev">Forrige</button><button type="button" id="next">Naeste</button></div></div>
    </section>
  </div>
</main>
<script src="portal-data.js?v=20260604-03"></script>
<script src="portal-header.js?v=20260604-03"></script>
<script>
var groups=[], newUserGroupIds=[], page=1, pageSize=10, total=0;
function groupName(id){var group=groups.find(function(g){return String(g.id)===String(id)});return group?group.name:"Gruppe "+id}
function renderGroupPicker(selectId,listId,selected){selected=(selected||[]).map(String);var options=groups.filter(function(g){return !selected.includes(String(g.id))});document.getElementById(selectId).innerHTML=options.length?options.map(function(g){return'<option value="'+g.id+'">'+PortalData.escape(g.name)+'</option>'}).join(""):'<option value="">Alle grupper er tilfoejet</option>';document.getElementById(selectId).disabled=!options.length;document.getElementById(listId).innerHTML=selected.length?selected.map(function(id){return'<span class="tag">'+PortalData.escape(groupName(id))+' <button type="button" data-remove-group="'+id+'">Fjern</button></span>'}).join(""):'<span class="meta">Ingen grupper valgt.</span>'}
function bindGroupRemovers(listId,selected,onChange){document.getElementById(listId).querySelectorAll("[data-remove-group]").forEach(function(button){button.onclick=function(){var id=String(button.dataset.removeGroup);selected.splice(selected.indexOf(id),1);onChange()}})}
function updateNewUserGroups(){renderGroupPicker("new-user-group","new-user-groups",newUserGroupIds);bindGroupRemovers("new-user-groups",newUserGroupIds,updateNewUserGroups)}
function params(){var d=Object.fromEntries(new FormData(filters));d.page=page;d.pageSize=pageSize;return d}
function renderUsers(data){total=data.total||0;var users=data.users||[];count.textContent=total?("Viser "+(((page-1)*pageSize)+1)+"-"+Math.min(page*pageSize,total)+" af "+total+" brugere"):"Ingen brugere matcher filteret";prev.disabled=page<=1;next.disabled=page*pageSize>=total;if(!users.length){document.getElementById("table-wrap").innerHTML='<div class="empty">Ingen brugere matcher filteret.</div>';return}document.getElementById("table-wrap").innerHTML='<table><thead><tr><th>Bruger</th><th>Rolle</th><th>Grupper</th><th>Profil</th><th></th></tr></thead><tbody>'+users.map(function(u){var profile=u.profileId?'<a href="partner-profil.html?id='+encodeURIComponent(u.profileId)+'">'+PortalData.escape(u.profileName||"Profil")+'</a>':'<span class="missing">Mangler</span>';return'<tr><td><strong>'+PortalData.escape(u.email)+'</strong></td><td>'+PortalData.escape(u.role)+'</td><td class="meta">'+PortalData.escape(u.groups||"Ingen")+'</td><td>'+profile+'</td><td><a class="button" href="admin-bruger.html?id='+encodeURIComponent(u.id)+'">Rediger</a></td></tr>'}).join("")+'</tbody></table>'}
async function load(){var data=await PortalData.adminUsers(params());renderUsers(data)}
PortalData.requireSession("admin").then(async function(){groups=await PortalData.groups();updateNewUserGroups();document.getElementById("group-filter").innerHTML='<option value="">Alle grupper</option>'+groups.map(function(g){return'<option value="'+g.id+'">'+PortalData.escape(g.name)+'</option>'}).join("");load()});
filters.onsubmit=function(e){e.preventDefault();page=1;load()};
prev.onclick=function(){if(page>1){page--;load()}};
next.onclick=function(){if(page*pageSize<total){page++;load()}};
document.getElementById("add-new-user-group").onclick=function(){var select=document.getElementById("new-user-group");if(select.value&&!newUserGroupIds.includes(String(select.value))){newUserGroupIds.push(String(select.value));updateNewUserGroups()}};
form.onsubmit=async function(e){e.preventDefault();var d=Object.fromEntries(new FormData(form));d.groupIds=newUserGroupIds.slice();try{await PortalData.addUser(d);form.reset();newUserGroupIds=[];updateNewUserGroups();notice.textContent="Brugeren er oprettet.";page=1;load()}catch(x){notice.textContent=x.message}};
</script>
</body>
</html>

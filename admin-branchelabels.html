<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Branchelabels | Administration</title>
  <link rel="stylesheet" href="portal-header.css?v=20260717-01">
  <style>
    :root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--danger:#a12626}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}
    main{max-width:1120px;margin:auto;padding:40px 24px 64px}a{color:var(--green)}h1{margin:10px 0 6px}
    .intro,.meta{color:var(--muted)}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
    .panel{padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}.panel+.panel{margin-top:18px}
    label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}
    input,select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px;background:#fff}
    button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--navy);font:inherit;cursor:pointer}
    .primary{border-color:var(--green);background:var(--green);color:#fff}.danger{color:var(--danger)}
    .button-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}.notice{min-height:20px;color:var(--green)}
    .preview{max-height:260px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:5px}
    .preview div{padding:9px 11px;border-bottom:1px solid var(--line)}.preview div:last-child{border-bottom:0}
    .filters{display:grid;grid-template-columns:minmax(180px,1fr) 150px 100px auto;gap:10px;align-items:end;margin-bottom:12px}
    .filters label{margin-top:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
    table{width:100%;border-collapse:collapse;min-width:500px}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
    th{color:var(--muted);font-size:12px;text-transform:uppercase}tr:last-child td{border-bottom:0}th:last-child,td:last-child{text-align:right}
    .pager{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px}.pager .button-row{margin-top:0}
    .empty{padding:28px;color:var(--muted);text-align:center}
    @media(max-width:900px){main{width:100%;max-width:100%;padding:28px 16px 48px!important;overflow-x:hidden}.layout{grid-template-columns:1fr}.layout,.panel,.table-wrap{width:100%;max-width:100%;min-width:0}.panel{padding:16px}.filters{grid-template-columns:1fr}.filters button{width:100%}.button-row button{width:100%}.pager{align-items:stretch;flex-direction:column}.pager .button-row button{width:100%}}
  </style>
</head>
<body>
<main>
  <a href="admin.html">&larr; Administration</a>
  <h1>Branchelabels</h1>
  <p class="intro">Opret enkeltvis eller importer mange labels fra CSV/XLSX.</p>
  <div class="layout">
    <section>
      <form class="panel" id="manual">
        <h2>Opret label</h2>
        <label>Navn<input name="name" required></label>
        <button class="primary">Opret</button>
        <p class="notice" id="manual-notice"></p>
      </form>
      <form class="panel" id="import-form">
        <h2>Importer fil</h2>
        <label>CSV eller XLSX<input name="file" id="file" type="file" accept=".csv,.xlsx" required></label>
        <p class="meta">Første ark bruges. Kolonnerne name, label, branche eller branch genkendes automatisk.</p>
        <div class="preview" id="preview" hidden></div>
        <div class="button-row">
          <button type="button" id="read">Vis preview</button>
          <button class="primary" id="import" disabled>Importer</button>
        </div>
        <p class="notice" id="import-notice"></p>
      </form>
    </section>
    <section class="panel">
      <h2>Eksisterende labels</h2>
      <form class="filters" id="filters">
        <label>Søg<input name="search" placeholder="Søg efter branchenavn"></label>
        <label>Anvendelse<select name="usage"><option value="">Alle</option><option value="used">I brug</option><option value="unused">Ikke i brug</option></select></label>
        <label>Pr. side<select name="pageSize"><option>10</option><option>25</option><option>50</option><option>100</option></select></label>
        <button class="primary">Filtrer</button>
      </form>
      <div class="table-wrap" id="table-wrap"><div class="empty">Henter labels...</div></div>
      <div class="pager">
        <span class="meta" id="count"></span>
        <div class="button-row"><button type="button" id="prev">Forrige</button><button type="button" id="next">Næste</button></div>
      </div>
    </section>
  </div>
</main>
<script src="xlsx.full.min.js"></script>
<script src="portal-data.js?v=20260811-01"></script>
<script src="portal-header.js?v=20260811-04"></script>
<script>
var pendingNames=[],page=1,total=0;
function extractNames(rows){if(!rows.length)return[];var headers=(rows[0]||[]).map(function(x){return String(x||"").trim().toLowerCase()}),known=["name","label","branche","branch"],index=headers.findIndex(function(x){return known.includes(x)}),start=0;if(index>=0)start=1;else{index=(rows[0]||[]).findIndex(function(x){return String(x||"").trim()!==""});if(index<0)return[]}return rows.slice(start).map(function(row){return String((row||[])[index]||"").trim()}).filter(Boolean)}
async function parseFile(){var selected=document.getElementById("file").files[0];if(!selected)throw new Error("Vælg en fil.");var data=await selected.arrayBuffer(),book=XLSX.read(data,{type:"array"}),sheet=book.Sheets[book.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,defval:""});pendingNames=extractNames(rows);var preview=document.getElementById("preview");preview.hidden=false;preview.innerHTML=pendingNames.slice(0,100).map(function(n){return"<div>"+PortalData.escape(n)+"</div>"}).join("")+(pendingNames.length>100?'<div class="meta">... og '+(pendingNames.length-100)+' flere</div>':"");document.getElementById("import").disabled=!pendingNames.length;document.getElementById("import-notice").textContent=pendingNames.length+" labels fundet."}
function parameters(){var data=Object.fromEntries(new FormData(document.getElementById("filters")));data.page=page;return data}
function render(data){total=data.total||0;var labels=data.labels||[],pageSize=Number(data.pageSize||10),start=((page-1)*pageSize)+1;document.getElementById("count").textContent=total?"Viser "+start+"-"+Math.min(page*pageSize,total)+" af "+total+" labels":"Ingen labels matcher filteret";document.getElementById("prev").disabled=page<=1;document.getElementById("next").disabled=page*pageSize>=total;if(!labels.length){document.getElementById("table-wrap").innerHTML='<div class="empty">Ingen labels matcher filteret.</div>';return}document.getElementById("table-wrap").innerHTML='<table><thead><tr><th>Branche</th><th>Profiler</th><th></th></tr></thead><tbody>'+labels.map(function(label){return'<tr><td><strong>'+PortalData.escape(label.name)+'</strong></td><td class="meta">'+label.profileCount+'</td><td><button class="danger" data-delete="'+label.id+'">Slet</button></td></tr>'}).join("")+'</tbody></table>';document.querySelectorAll("[data-delete]").forEach(function(button){button.onclick=async function(){if(confirm("Slet label?")){await PortalData.deleteLabel(button.dataset.delete);var lastPage=Math.max(1,Math.ceil((total-1)/pageSize));page=Math.min(page,lastPage);load()}}})}
async function load(){render(await PortalData.adminLabels(parameters()))}
PortalData.requireSession("admin").then(load);
document.getElementById("filters").onsubmit=function(event){event.preventDefault();page=1;load()};
document.getElementById("prev").onclick=function(){if(page>1){page--;load()}};
document.getElementById("next").onclick=function(){var pageSize=Number(document.querySelector('[name="pageSize"]').value);if(page*pageSize<total){page++;load()}};
document.getElementById("read").onclick=function(){parseFile().catch(function(error){document.getElementById("import-notice").textContent=error.message})};
document.getElementById("import-form").onsubmit=async function(event){event.preventDefault();var notice=document.getElementById("import-notice");try{var result=(await PortalData.importLabels(pendingNames)).result;notice.textContent=result.created+" oprettet, "+result.skipped+" eksisterede, "+result.duplicates+" dubletter, "+result.invalid+" ugyldige.";pendingNames=[];document.getElementById("import").disabled=true;page=1;load()}catch(error){notice.textContent=error.message}};
document.getElementById("manual").onsubmit=async function(event){event.preventDefault();var form=event.currentTarget,notice=document.getElementById("manual-notice");try{await PortalData.addLabel(Object.fromEntries(new FormData(form)));form.reset();notice.textContent="Label oprettet.";page=1;load()}catch(error){notice.textContent=error.message}};
</script>
</body>
</html>

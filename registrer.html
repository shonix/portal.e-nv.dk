<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Registrer | Partnerportal</title><link rel="stylesheet" href="portal-header.css?v=20260604-03"><style>:root{--navy:#15243a;--green:#087563;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial}main{max-width:460px;margin:8vh auto;padding:24px}.panel{padding:26px;border:1px solid var(--line);border-radius:8px;background:#fff}h1{margin:0 0 8px}p{color:var(--muted);line-height:1.5}label{display:block;margin-top:14px;color:var(--muted);font-size:13px;font-weight:bold}input{width:100%;margin-top:5px;padding:11px;border:1px solid var(--line);border-radius:5px}button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:5px;background:var(--green);color:#fff;font-weight:bold}.error{display:none;color:#a12626}</style></head><body><main><form class="panel" id="form"><h1>Registrer</h1><p>Opret din konto via invitationen.</p><label>Adgangskode<input name="password" type="password" minlength="10" required></label><label>Gentag adgangskode<input name="confirmPassword" type="password" minlength="10" required></label><button>Opret konto</button><p class="error" id="error"></p></form></main><script src="portal-data.js?v=20260604-03"></script><script src="portal-header.js?v=20260604-03"></script><script>var token=new URLSearchParams(location.search).get("token");if(!token){error.textContent="Invitationen mangler eller er ugyldig.";error.style.display="block";form.querySelector("button").disabled=true}form.onsubmit=async function(e){e.preventDefault();error.style.display="none";if(form.password.value!==form.confirmPassword.value){error.textContent="Adgangskoderne er ikke ens.";error.style.display="block";return}try{await PortalData.register(token,form.password.value);location.href="min-profil.html"}catch(x){error.textContent=x.message;error.style.display="block"}};</script></body></html>

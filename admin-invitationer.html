<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Invitationer | Administration</title><style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial}main{max-width:900px;margin:auto;padding:40px 20px}a{color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.panel,.item{padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}.item{margin-top:10px}label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px}button{margin-top:16px;padding:10px 14px;border:0;border-radius:5px;background:var(--green);color:#fff}.notice{color:var(--green);overflow-wrap:anywhere}.warning{color:#a12626}.meta{color:var(--muted);font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="admin.html">&larr; Administration</a><h1>Invitationer</h1><p>Opret et engangslink og send invitationen til medlemmet via e-mail.</p><div class="grid"><form class="panel" id="form"><h2>Ny invitation</h2><label>E-mail<input name="email" type="email" required></label><button>Opret og send invitation</button><p class="notice" id="notice"></p></form><section class="panel"><h2>Seneste invitationer</h2><div id="list"></div></section></div></main><script src="portal-data.js?v=20260604-02"></script><script src="portal-header.js?v=20260604-02"></script><script>async function load(){var rows=await PortalData.invitations();list.innerHTML=rows.length?rows.map(function(x){return'<div class="item"><strong>'+PortalData.escape(x.email)+'</strong><p class="meta">'+(x.usedAt?"Brugt":"Ikke brugt")+' \u00b7 Udl\u00f8ber '+PortalData.escape(x.expiresAt)+'</p></div>'}).join(""):"<p>Ingen invitationer endnu.</p>"}PortalData.requireSession("admin").then(load);form.onsubmit=async function(e){e.preventDefault();try{var x=await PortalData.addInvitation(Object.fromEntries(new FormData(form)));notice.className=x.invitation.emailSent?"notice":"notice warning";notice.textContent=x.invitation.emailSent?"Invitationen er sendt. Link: "+x.invitation.url:"Linket blev oprettet, men e-mailen kunne ikke sendes automatisk. Send linket manuelt: "+x.invitation.url;form.reset();load()}catch(x){notice.className="notice warning";notice.textContent=x.message}};</script></body></html>

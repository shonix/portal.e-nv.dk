<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Branchelabels | Administration</title><style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial}main{max-width:900px;margin:auto;padding:40px 20px}a{color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.item{padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}.item{display:flex;justify-content:space-between;align-items:center;margin-top:10px}label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px}button{padding:9px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}.primary{width:100%;margin-top:16px;border:0;background:var(--green);color:#fff}.notice{color:var(--green)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="admin.html">&larr; Administration</a><h1>Branchelabels</h1><p>Opret de labels, som medlemmer kan v&aelig;lge p&aring; deres profiler.</p><div class="grid"><form class="panel" id="form"><h2>Opret label</h2><label>Navn<input name="name" placeholder="H&aring;ndv&aelig;rker" required></label><button class="primary">Opret label</button><p class="notice" id="notice"></p></form><section class="panel"><h2>Labels</h2><div id="list"></div></section></div></main><script src="portal-data.js?v=20260604-02"></script><script src="portal-header.js?v=20260717-04"></script><script>async function load(){var labels=await PortalData.labels();list.innerHTML=labels.length?labels.map(function(l){return'<div class="item"><strong>'+PortalData.escape(l.name)+'</strong><button data-id="'+l.id+'">Slet</button></div>'}).join(""):"<p>Der er ingen labels endnu.</p>";list.querySelectorAll("button").forEach(function(b){b.onclick=async function(){if(confirm("Slet dette label?")){await PortalData.deleteLabel(b.dataset.id);load()}}})}PortalData.requireSession("admin").then(load);form.onsubmit=async function(e){e.preventDefault();try{await PortalData.addLabel(Object.fromEntries(new FormData(form)));form.reset();notice.textContent="Label er oprettet.";load()}catch(x){notice.textContent=x.message}};</script></body></html>

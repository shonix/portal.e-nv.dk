<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partnere | Partnerportal</title>
  <link rel="stylesheet" href="portal-header.css?v=20260604-03">
  <style>
    :root {
      --navy: #15243a;
      --green: #163674;
      --line: #d6dde3;
      --muted: #5d6b80;
      --page: #f5f7f9;
      --surface: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
    }

    .partner-directory {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 26px;
      color: var(--green);
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .back-link:hover,
    .profile-card:hover h2 { text-decoration: underline; }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      line-height: 1.1;
    }

    .intro {
      margin: 8px 0 24px;
      color: var(--muted);
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .profile-card {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      min-height: 118px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .profile-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
    }

    .avatar {
      display: flex;
      width: 56px;
      height: 56px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: 24px;
      font-weight: bold;
    }

    h2 {
      margin: 0 0 4px;
      color: var(--green);
      font-size: 20px;
    }

    .profile-card p {
      margin: 4px 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.35;
    }

    .labels { color: var(--green) !important; font-size: 13px !important; font-weight: bold; }

    @media (max-width: 900px) {
      .profile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 580px) {
      .partner-directory { padding: 32px 18px 48px; }
      .profile-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="partner-directory">
    <a class="back-link" href="partner-portal.html">&larr; Tilbage til partnerportalen</a>
    <p class="eyebrow">Netværk</p>
    <h1>Partnere</h1>
    <p class="intro">Se partnerprofiler og kontaktinformation.</p>

    <section class="profile-grid" id="profile-grid" aria-label="Partnere"></section>
  </main>
  <script src="portal-data.js?v=20260604-02"></script><script src="portal-header.js?v=20260604-02"></script>
  <script>
    PortalData.requireSession().then(function () { return PortalData.myGroups(); }).then(async function (groups) {
      var responses = await Promise.all(groups.map(function (group) { return PortalData.groupPartners(group.id); }));
      var seen = {};
      return responses.flatMap(function (response) { return response.partners; }).filter(function (partner) {
        if (seen[partner.id]) return false;
        seen[partner.id] = true;
        return true;
      });
    }).then(function (partners) {
      document.getElementById("profile-grid").innerHTML = partners.length ? partners.map(function (partner) {
        return '<a class="profile-card" href="partner-profil.html?id=' + encodeURIComponent(partner.id) + '"><span class="avatar">' +
          PortalData.escape(partner.name.charAt(0)) + '</span><span><h2>' + PortalData.escape(partner.name) + '</h2>' +
          (partner.company ? '<p>' + PortalData.escape(partner.company) + '</p>' : '') +
          '<p class="labels">' + PortalData.escape(partner.labels || "") + '</p></span></a>';
      }).join("") : '<p>Der er endnu ingen partnerprofiler i dine grupper.</p>';
    }).catch(function (problem) {
      document.getElementById("profile-grid").innerHTML = '<p>Partnerne kunne ikke hentes: ' + PortalData.escape(problem.message) + '</p>';
    });
  </script>
</body>
</html>

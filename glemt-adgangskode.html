<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Nulstil adgangskode | Partnerportalen</title>
  <link rel="stylesheet" href="portal-header.css?v=20260717-01">
  <style>
    :root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--surface:#fff;--danger:#a12626}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}
    main{max-width:460px;margin:8vh auto;padding:24px}.panel{padding:26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
    h1{margin:0 0 8px;font-size:30px}p{color:var(--muted);line-height:1.5}label{display:block;margin-top:14px;color:var(--muted);font-size:13px;font-weight:bold}
    input{width:100%;margin-top:5px;padding:11px;border:1px solid var(--line);border-radius:5px;font:inherit}button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:5px;background:var(--green);color:#fff;cursor:pointer;font:inherit;font-weight:bold}
    button:disabled{cursor:not-allowed;opacity:.65}.error{color:var(--danger)}.success{color:var(--green)}.back-link{margin-top:20px;font-size:14px}a{color:var(--green);text-underline-offset:3px}@media(max-width:520px){main{margin:24px auto;padding:16px}.panel{padding:20px}}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>Nulstil adgangskode</h1>
    <p id="intro">Indtast e-mailadressen til din konto, så sender vi et personligt nulstillingslink.</p>
    <form id="request-form">
      <label>E-mail<input name="email" type="email" autocomplete="email" required autofocus></label>
      <button type="submit">Send nulstillingslink</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
    <p class="back-link"><a href="login.html">&larr; Tilbage til login</a></p>
  </section>
</main>
<script src="portal-data.js?v=20260917-01"></script>
<script>
var requestForm=document.getElementById("request-form"),intro=document.getElementById("intro"),result=document.getElementById("result");
requestForm.onsubmit=async function(event){event.preventDefault();result.textContent="";result.className="";var button=requestForm.querySelector("button");button.disabled=true;button.textContent="Sender...";try{await PortalData.requestPasswordReset(requestForm.email.value);requestForm.hidden=true;intro.textContent="Tjek din indbakke";result.textContent="Hvis der findes en konto med e-mailadressen, har vi sendt et nulstillingslink. Linket gælder i 60 minutter. Tjek også mappen med uønsket post.";result.className="success"}catch(problem){result.textContent=problem.message;result.className="error";button.disabled=false;button.textContent="Send nulstillingslink"}};
</script>
</body>
</html>

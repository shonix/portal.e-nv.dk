<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Grupper | Administration</title><link rel="stylesheet" href="portal-header.css?v=20260604-03"><style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--surface:#fff;--danger:#a12626}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:920px;margin:auto;padding:40px 20px 64px}a{color:var(--green);text-underline-offset:3px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}form,.item{padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.item{margin-bottom:12px}label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px;background:#fff}.button-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--navy);font:inherit;cursor:pointer}.primary{border-color:var(--green);background:var(--green);color:#fff}.danger{border-color:var(--danger);color:var(--danger)}h1{margin:10px 0 6px;font-size:34px}.intro,.meta{color:var(--muted)}.notice{min-height:20px;color:var(--green)}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="admin.html">&larr; Administration</a><h1>Grupper</h1><p class="intro">Opret, rediger og slet partnergrupper.</p><div class="grid"><form id="form"><h2>Ny gruppe</h2><label>Gruppenavn<input name="name" required></label><label>Adresse<input name="address"></label><button class="primary">Opret gruppe</button><p class="notice" id="notice"></p></form><section id="list"></section></div></main><script src="portal-data.js?v=20260604-03"></script><script src="portal-header.js?v=20260604-03"></script><script>
function groupForm(x){return'<form class="item group-form" data-group-id="'+x.id+'"><label>Gruppenavn<input name="name" value="'+PortalData.escape(x.name)+'" required></label><label>Adresse<input name="address" value="'+PortalData.escape(x.address||"")+'"></label><p class="meta"><a href="admin-gruppe.html?id='+encodeURIComponent(x.id)+'">'+x.memberCount+' medlemmer · Administrer medlemmer</a></p><div class="button-row"><button class="primary">Gem</button><button type="button" class="danger" data-delete="'+x.id+'">Slet</button></div><p class="notice"></p></form>'}
function bind(){document.querySelectorAll(".group-form").forEach(function(f){f.onsubmit=async function(e){e.preventDefault();var n=f.querySelector(".notice");var data=Object.fromEntries(new FormData(f));data.groupId=f.dataset.groupId;try{await PortalData.updateGroup(data);n.textContent="Gruppen er gemt.";load()}catch(x){n.textContent=x.message}}});document.querySelectorAll("[data-delete]").forEach(function(b){b.onclick=async function(){if(!confirm("Slet denne gruppe? Brugerne slettes ikke, men deres medlemskab af gruppen fjernes."))return;try{await PortalData.deleteGroup(b.dataset.delete);load()}catch(x){alert(x.message)}}})}
function load(){PortalData.groups().then(function(items){list.innerHTML=items.length?items.map(groupForm).join(""):'<p class="meta">Der er ingen grupper endnu.</p>';bind()})}
PortalData.requireSession("admin").then(load);
form.onsubmit=async function(e){e.preventDefault();try{await PortalData.addGroup(Object.fromEntries(new FormData(form)));form.reset();notice.textContent="Gruppen er oprettet.";load()}catch(x){notice.textContent=x.message}};
</script></body></html>

<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Møde | Partnerportal</title>
  <link rel="stylesheet" href="portal-header.css?v=20260717-01">
  <style>
    :root { --navy:#15243a; --green:#163674; --line:#d6dde3; --muted:#5d6b80; --page:#f5f7f9; --surface:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--navy); font-family:Arial,Helvetica,sans-serif; }
    main { max-width:820px; margin:auto; padding:40px 24px 64px; }
    a { color:var(--green); text-underline-offset:3px; }
    .card { margin-top:18px; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .cover { padding:24px; background:linear-gradient(135deg,#263764,#8ab9a2); color:#fff; }
    h1 { margin:0 0 12px; font-size:30px; }
    .date-line { display:flex; flex-wrap:wrap; gap:10px 24px; font-weight:bold; }
    .address { margin:12px 0 0; color:#fff; }
    .details { padding:8px 24px 20px; }
    .row { display:grid; grid-template-columns:32px minmax(0,1fr); gap:12px; padding:16px 0; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .icon { width:24px; height:24px; fill:none; stroke:var(--green); stroke-linecap:round; stroke-linejoin:round; stroke-width:1.8; }
    h2 { margin:0 0 5px; font-size:15px; letter-spacing:.5px; text-transform:uppercase; }
    p { margin:0; color:var(--muted); line-height:1.5; }
    .multiline { white-space:pre-line; }
    .file-module { margin-top:18px; padding:22px 24px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .file-list { display:grid; gap:10px; }
    .file-item { display:flex; justify-content:space-between; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
    .file-item:last-child { border-bottom:0; }
    .file-actions { display:flex; flex-wrap:wrap; gap:10px; }
    .attendance-module { margin-top:18px; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .attendance-module summary { display:flex; justify-content:space-between; gap:16px; align-items:center; min-height:58px; padding:14px 18px; cursor:pointer; list-style:none; }
    .attendance-module summary::-webkit-details-marker { display:none; }
    .attendance-module summary strong { color:var(--navy); font-size:16px; }
    .attendance-summary { display:flex; align-items:center; gap:10px; }
    .attendance-summary::before { content:"+"; width:24px; color:var(--green); font-size:22px; line-height:1; text-align:center; }
    .attendance-module[open] .attendance-summary::before { content:"−"; }
    .attendance-count { flex:0 0 auto; padding:5px 9px; border-radius:999px; background:#e8f4ef; color:var(--green); font-size:12px; font-weight:bold; }
    .attendance-body { padding:0 18px 18px; border-top:1px solid var(--line); }
    .attendance-toolbar { display:grid; grid-template-columns:minmax(180px,1fr) auto; gap:12px; align-items:end; padding:16px 0 12px; }
    .attendance-filters { display:grid; grid-template-columns:repeat(3,auto); gap:6px; }
    .attendance-filters button { min-height:40px; border-color:var(--line); background:#fff; color:var(--navy); }
    .attendance-filters button[aria-pressed="true"] { border-color:var(--green); background:var(--green); color:#fff; }
    .attendance-list { overflow:hidden; border:1px solid var(--line); border-radius:8px; }
    .attendance-row { display:grid; grid-template-columns:24px minmax(0,1fr); gap:12px; align-items:center; min-height:62px; margin:0; padding:10px 12px; border-bottom:1px solid var(--line); color:var(--navy); cursor:pointer; }
    .attendance-row:last-child { border-bottom:0; }
    .attendance-row.is-attended { background:#eef8f3; }
    .attendance-row input { width:22px!important; height:22px!important; min-width:22px; margin:0!important; padding:0; accent-color:var(--green); }
    .attendance-person { min-width:0; }
    .attendance-person strong { display:block; margin-bottom:3px; overflow-wrap:anywhere; }
    .attendance-person small { display:block; color:var(--muted); font-size:13px; font-weight:normal; line-height:1.35; overflow-wrap:anywhere; }
    .attendance-badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
    .attendance-badge { padding:3px 6px; border-radius:999px; background:#edf1f5; color:var(--muted); font-size:11px; font-weight:bold; }
    .attendance-badge.pending { background:#fff4d6; color:#775a00; }
    .attendance-notice { min-height:20px; margin:0 0 8px; color:var(--muted); font-size:13px; }
    .guest-module { margin-top:18px; padding:22px 24px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .guest-form { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; align-items:end; margin-top:12px; }
    .guest-form label:first-child { grid-column:1 / -1; }
    .guest-import { margin-top:18px; padding-top:18px; border-top:1px solid var(--line); }
    .guest-import-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
    .guest-preview { max-height:190px; margin-top:12px; overflow:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .guest-preview div { padding:9px 12px; border-bottom:1px solid var(--line); color:var(--muted); font-size:13px; }
    .guest-preview div:last-child { border-bottom:0; }
    .guest-list { display:grid; gap:10px; margin-top:16px; }
    .guest-item { padding:12px 0; border-top:1px solid var(--line); }
    .guest-item strong { color:var(--green); }
    .partner-module { margin-top:18px; padding:22px 24px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .partner-module h2 { margin-bottom:14px; color:var(--navy); }
    .partner-filters { display:grid; grid-template-columns:minmax(180px,1fr) 180px auto; gap:10px; align-items:end; margin-bottom:14px; }
    label { display:block; color:var(--muted); font-size:13px; font-weight:bold; }
    input,select { width:100%; margin-top:5px; padding:10px; border:1px solid var(--line); border-radius:5px; background:#fff; font:inherit; }
    button { min-height:38px; padding:9px 13px; border:1px solid var(--green); border-radius:5px; background:var(--green); color:#fff; font:inherit; cursor:pointer; }
    .partner-list { overflow:hidden; border:1px solid var(--line); border-radius:8px; }
    .partner-row { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr); gap:14px; padding:14px; border-bottom:1px solid var(--line); }
    .partner-row:last-child { border-bottom:0; }
    .partner-name { margin:0 0 5px; color:var(--green); font-weight:bold; }
    .partner-tags { display:flex; flex-wrap:wrap; align-items:flex-start; align-content:flex-start; gap:6px; }
    .partner-tag { display:inline-flex; align-items:center; max-width:100%; min-height:26px; padding:4px 8px; border:1px solid #cbd7e2; border-radius:999px; color:var(--green); font-size:12px; font-weight:bold; line-height:1.2; overflow-wrap:anywhere; }
    .partner-links { display:flex; flex-wrap:wrap; gap:10px; }
    .pager { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-top:12px; }
    .portal-meta { color:var(--muted); font-size:13px; }
    .pager-buttons { display:flex; gap:8px; }
    .secondary { border-color:var(--line); background:#fff; color:var(--navy); }
    .empty { padding:20px; color:var(--muted); text-align:center; }
    @media(max-width:680px){main{padding:28px 16px 48px}.partner-filters,.partner-row,.guest-form,.attendance-toolbar{grid-template-columns:1fr}.pager{align-items:stretch;flex-direction:column}.file-item{align-items:flex-start;flex-direction:column}.guest-import-actions button{width:100%}.attendance-module summary{padding:14px}.attendance-body{padding:0 12px 14px}.attendance-filters{grid-template-columns:repeat(3,minmax(0,1fr))}.attendance-filters button{padding:8px 5px}.attendance-row{min-height:66px;padding:11px 10px}}
  </style>
</head>
<body>
  <main>
    <a href="index.html">&larr; Tilbage til partnerportalen</a>
    <article class="card">
      <header class="cover">
        <h1 id="title"></h1>
        <div class="date-line"><span id="date"></span><span id="time"></span></div>
        <p class="address" id="address"></p>
      </header>
      <section class="details" id="details"></section>
    </article>
    <details class="attendance-module" id="attendance-module" hidden>
      <summary>
        <span class="attendance-summary"><strong>Afkryds deltagere</strong></span>
        <span class="attendance-count" id="attendance-count">Henter...</span>
      </summary>
      <div class="attendance-body">
        <div class="attendance-toolbar">
          <label>Søg<input id="attendance-search" type="search" placeholder="Navn, firma eller e-mail"></label>
          <div class="attendance-filters" aria-label="Filtrer fremmøde">
            <button type="button" data-attendance-filter="all" aria-pressed="true">Alle</button>
            <button type="button" data-attendance-filter="absent" aria-pressed="false">Ikke mødt</button>
            <button type="button" data-attendance-filter="attended" aria-pressed="false">Mødt</button>
          </div>
        </div>
        <p class="attendance-notice" id="attendance-notice" aria-live="polite"></p>
        <div class="attendance-list" id="attendance-list"><div class="empty">Henter deltagere...</div></div>
      </div>
    </details>
    <section class="file-module" id="file-module" hidden>
      <h2>Filer</h2>
      <div class="file-list" id="file-list"></div>
    </section>
    <section class="guest-module" id="guest-module" hidden>
      <h2>Tilføj gæst</h2>
      <p>Registrer gæster til mødet med navn, firmanavn og e-mail.</p>
      <form class="guest-form" id="guest-form">
        <label>Navn<input name="name" required></label>
        <label>Firmanavn<input name="company" required></label>
        <label>E-mail<input name="email" type="email" required></label>
        <button>Tilføj gæst</button>
      </form>
      <div class="guest-import">
        <h2>Importér gæster</h2>
        <p>Upload CSV eller Excel med kolonnerne navn, firmanavn og email.</p>
        <label>Fil<input id="guest-file" type="file" accept=".csv,.xlsx,.xls"></label>
        <div class="guest-import-actions">
          <button type="button" class="secondary" id="guest-read">Læs fil</button>
          <button type="button" id="guest-import" disabled>Importér gæster</button>
        </div>
        <div class="guest-preview" id="guest-preview" hidden></div>
      </div>
      <p class="portal-meta" id="guest-notice"></p>
      <div class="guest-list" id="guest-list"></div>
    </section>
    <section class="partner-module" id="partner-module" hidden>
      <h2>Partnere</h2>
      <form class="partner-filters" id="partner-filters">
        <label>Søg<input name="search" placeholder="Navn, firma, e-mail eller branche"></label>
        <label>Branche<select name="labelId" id="partner-label"><option value="">Alle brancher</option></select></label>
        <button>Filtrer</button>
      </form>
      <div class="partner-list" id="partner-list"><div class="empty">Henter partnere...</div></div>
      <div class="pager">
        <span class="portal-meta" id="partner-count"></span>
        <div class="pager-buttons">
          <button type="button" class="secondary" id="partner-prev">Forrige</button>
          <button type="button" class="secondary" id="partner-next">Næste</button>
        </div>
      </div>
    </section>
  </main>
  <script src="xlsx.full.min.js"></script><script src="portal-data.js?v=20260604-02"></script><script src="portal-header.js?v=20260717-04"></script>
  <script>
    var icons = {
      partners:'<svg class="icon" viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7" r="3"/><path d="M22 20v-1.5a4 4 0 0 0-3-3.85M16 4.15a3 3 0 0 1 0 5.7"/></svg>',
      program:'<svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
      location:'<svg class="icon" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/></svg>',
      guests:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>'
    };
    var labels = { program:"Program", location:"Lokation", guests:"G\u00e6ster" };
    var id = new URLSearchParams(location.search).get("id"), currentMeeting = null, partnerPage = 1, partnerTotal = 0, partnerPageSize = 8, pendingGuests = [], attendanceRows = [], attendanceFilter = "all";
    function bytes(n){n=Number(n||0);if(n<1024)return n+" B";if(n<1048576)return Math.round(n/1024)+" KB";return(Math.round(n/104857.6)/10)+" MB"}
    function partnerParameters() {
      var data = Object.fromEntries(new FormData(document.getElementById("partner-filters")));
      data.id = currentMeeting.id || currentMeeting.slug;
      data.page = partnerPage;
      data.pageSize = partnerPageSize;
      return data;
    }
    function link(url, label) {
      return url ? '<a href="'+PortalData.escape(url)+'" target="_blank" rel="noopener">'+label+'</a>' : "";
    }
    function renderPartnerRows(data) {
      var rows = data.partners || [];
      partnerTotal = data.total || 0;
      if (data.labels && !document.getElementById("partner-label").dataset.loaded) {
        document.getElementById("partner-label").innerHTML = '<option value="">Alle brancher</option>' + data.labels.map(function(label) {
          return '<option value="'+label.id+'">'+PortalData.escape(label.name)+'</option>';
        }).join("");
        document.getElementById("partner-label").dataset.loaded = "1";
      }
      document.getElementById("partner-count").textContent = partnerTotal ? "Viser " + (((partnerPage-1)*partnerPageSize)+1) + "-" + Math.min(partnerPage*partnerPageSize, partnerTotal) + " af " + partnerTotal + " partnere" : "Ingen partnere matcher filteret";
      document.getElementById("partner-prev").disabled = partnerPage <= 1;
      document.getElementById("partner-next").disabled = partnerPage * partnerPageSize >= partnerTotal;
      if (!rows.length) {
        document.getElementById("partner-list").innerHTML = '<div class="empty">Ingen partnere matcher filteret.</div>';
        return;
      }
      document.getElementById("partner-list").innerHTML = rows.map(function(partner) {
        var name = partner.id ? '<a class="partner-name" href="partner-profil.html?id='+encodeURIComponent(partner.id)+'">'+PortalData.escape(partner.name)+'</a>' : '<p class="partner-name">'+PortalData.escape(partner.name)+'</p>';
        var tags = (partner.labels || "").split(",").map(function(x){return x.trim();}).filter(Boolean).map(function(label){return '<span class="partner-tag">'+PortalData.escape(label)+'</span>';}).join("");
        var links = [partner.email ? '<a href="mailto:'+PortalData.escape(partner.email)+'">'+PortalData.escape(partner.email)+'</a>' : "", link(partner.linkedin, "LinkedIn"), link(partner.companyUrl, "Hjemmeside")].filter(Boolean).join("");
        return '<div class="partner-row"><div>'+name+'<p>'+PortalData.escape(partner.company || "")+'</p></div><div class="partner-tags">'+(tags || '<span class="portal-meta">Ingen branchelabels</span>')+'</div><div class="partner-links">'+(links || '<span class="portal-meta">Ingen kontaktinfo</span>')+'</div></div>';
      }).join("");
    }
    async function loadPartners() {
      document.getElementById("partner-module").hidden = false;
      try {
        renderPartnerRows(await PortalData.meetingPartners(partnerParameters()));
      } catch (error) {
        document.getElementById("partner-list").innerHTML = '<div class="empty">Log ind for at se mødets partnere.</div>';
        document.getElementById("partner-count").textContent = "";
        document.getElementById("partner-prev").disabled = true;
        document.getElementById("partner-next").disabled = true;
      }
    }
    async function loadFiles() {
      try {
        var files = await PortalData.publicMeetingAttachments(currentMeeting.id);
        if (!files.length) return;
        document.getElementById("file-module").hidden = false;
        document.getElementById("file-list").innerHTML = files.map(function(file) {
          var base = 'api/index.php?action=meeting-download-attachment&attachmentId=' + encodeURIComponent(file.id);
          return '<div class="file-item"><div><strong>'+PortalData.escape(file.name)+'</strong><br><span class="portal-meta">'+bytes(file.size)+' · '+PortalData.escape(file.mimeType)+'</span></div><div class="file-actions"><a href="'+base+'&preview=1" target="_blank" rel="noopener">Vis</a><a href="'+base+'">Download</a></div></div>';
        }).join("");
      } catch (error) {
        if (currentMeeting.files) return;
        document.getElementById("file-module").hidden = false;
        document.getElementById("file-list").innerHTML = '<div class="empty">Log ind for at se mødets filer.</div>';
      }
    }
    function renderGuests(guests) {
      document.getElementById("guest-list").innerHTML = guests.length ? guests.map(function(guest) {
        return '<div class="guest-item"><strong>'+PortalData.escape(guest.name)+'</strong><br><span class="portal-meta">'+PortalData.escape(guest.company)+' · <a href="mailto:'+PortalData.escape(guest.email)+'">'+PortalData.escape(guest.email)+'</a></span></div>';
      }).join("") : '<p class="portal-meta">Der er endnu ingen gæster registreret.</p>';
    }
    function normalizeHeader(value) {
      return String(value || "").trim().toLowerCase().replace(/æ/g,"ae").replace(/ø/g,"oe").replace(/å/g,"aa").replace(/[^a-z0-9]/g,"");
    }
    function guestColumn(headers, names) {
      var normalized = headers.map(normalizeHeader);
      for (var i = 0; i < names.length; i++) {
        var index = normalized.indexOf(names[i]);
        if (index >= 0) return index;
      }
      return -1;
    }
    function extractGuests(rows) {
      if (!rows.length) return [];
      var headers = rows[0] || [];
      var nameIndex = guestColumn(headers, ["navn","name"]);
      var companyIndex = guestColumn(headers, ["firmanavn","firma","virksomhed","company"]);
      var emailIndex = guestColumn(headers, ["email","emailadresse","mail","epost"]);
      if (nameIndex < 0 || companyIndex < 0 || emailIndex < 0) {
        throw new Error("Filen skal have kolonnerne navn, firmanavn og email.");
      }
      return rows.slice(1).map(function(row) {
        return {
          name: String((row || [])[nameIndex] || "").trim(),
          company: String((row || [])[companyIndex] || "").trim(),
          email: String((row || [])[emailIndex] || "").trim()
        };
      }).filter(function(guest) { return guest.name || guest.company || guest.email; });
    }
    async function parseGuestFile() {
      var selected = document.getElementById("guest-file").files[0];
      if (!selected) throw new Error("Vælg en CSV eller Excel-fil.");
      var data = await selected.arrayBuffer();
      var book = XLSX.read(data, { type:"array" });
      var sheet = book.Sheets[book.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:"" });
      pendingGuests = extractGuests(rows);
      var preview = document.getElementById("guest-preview");
      preview.hidden = false;
      preview.innerHTML = pendingGuests.length ? pendingGuests.slice(0, 50).map(function(guest) {
        return "<div>" + PortalData.escape(guest.name) + " · " + PortalData.escape(guest.company) + " · " + PortalData.escape(guest.email) + "</div>";
      }).join("") + (pendingGuests.length > 50 ? '<div>... og '+(pendingGuests.length-50)+' flere</div>' : "") : '<div>Ingen gæster fundet.</div>';
      document.getElementById("guest-import").disabled = !pendingGuests.length;
      document.getElementById("guest-notice").textContent = pendingGuests.length + " gæster fundet.";
    }
    async function loadGuests() {
      try {
        document.getElementById("guest-module").hidden = false;
        renderGuests(await PortalData.meetingGuests(currentMeeting.id || currentMeeting.slug));
      } catch (error) {
        document.getElementById("guest-module").hidden = false;
        document.getElementById("guest-form").style.display = "none";
        document.getElementById("guest-list").innerHTML = '<p class="portal-meta">Log ind for at tilføje eller se gæster.</p>';
      }
    }
    function attendanceMatches(row) {
      var search = document.getElementById("attendance-search").value.trim().toLowerCase();
      var text = [row.name,row.company,row.email].join(" ").toLowerCase();
      if (search && !text.includes(search)) return false;
      if (attendanceFilter === "attended") return row.attended;
      if (attendanceFilter === "absent") return !row.attended;
      return true;
    }
    function renderAttendance() {
      var attended = attendanceRows.filter(function(row) { return row.attended; }).length;
      document.getElementById("attendance-count").textContent = attended + " af " + attendanceRows.length + " mødt";
      document.querySelectorAll("[data-attendance-filter]").forEach(function(button) {
        button.setAttribute("aria-pressed", String(button.dataset.attendanceFilter === attendanceFilter));
      });
      var visible = attendanceRows.filter(attendanceMatches);
      document.getElementById("attendance-list").innerHTML = visible.length ? visible.map(function(row) {
        var details = [row.company,row.email].filter(Boolean).map(PortalData.escape).join(" · ");
        var badges = '<span class="attendance-badge">'+(row.attendeeType === "guest" ? "Gæst" : "Partner")+'</span>';
        if (row.approvalStatus === "pending") badges += '<span class="attendance-badge pending">Afventer</span>';
        return '<label class="attendance-row'+(row.attended?' is-attended':'')+'"><input type="checkbox" data-attendee-type="'+PortalData.escape(row.attendeeType)+'" data-attendee-id="'+PortalData.escape(row.attendeeId)+'" '+(row.attended?'checked':'')+'><span class="attendance-person"><strong>'+PortalData.escape(row.name)+'</strong><small>'+details+'</small><span class="attendance-badges">'+badges+'</span></span></label>';
      }).join("") : '<div class="empty">Ingen deltagere matcher filteret.</div>';
      document.querySelectorAll("#attendance-list input[type=checkbox]").forEach(function(checkbox) {
        checkbox.onchange = async function() {
          var desired = checkbox.checked;
          var row = attendanceRows.find(function(item) { return item.attendeeType === checkbox.dataset.attendeeType && String(item.attendeeId) === String(checkbox.dataset.attendeeId); });
          if (!row) return;
          checkbox.disabled = true;
          document.getElementById("attendance-notice").textContent = "Gemmer...";
          try {
            var result = await PortalData.saveMeetingAttendance({meetingId:currentMeeting.id,attendeeType:row.attendeeType,attendeeId:row.attendeeId,attended:desired});
            row.attended = result.attended;
            row.attendedAt = result.attendedAt;
            document.getElementById("attendance-notice").textContent = "Fremmøde gemt.";
            renderAttendance();
          } catch (error) {
            document.getElementById("attendance-notice").textContent = error.message;
            renderAttendance();
          }
        };
      });
    }
    async function loadAttendance() {
      var list = document.getElementById("attendance-list");
      try {
        var data = await PortalData.meetingAttendance(currentMeeting.id);
        attendanceRows = data.attendees || [];
        renderAttendance();
      } catch (error) {
        document.getElementById("attendance-count").textContent = "Kunne ikke hente";
        list.innerHTML = '<div class="empty">'+PortalData.escape(error.message)+'</div>';
      }
    }
    async function configureAttendance() {
      try {
        var session = await PortalData.session();
        if (session.role !== "admin") return;
        document.getElementById("attendance-module").hidden = false;
        loadAttendance();
      } catch (error) {}
    }
    PortalData.meetings().then(function (meetings) { return meetings.find(function (meeting) { return meeting.id === id || meeting.slug === id; }); }).then(function (meeting) {
      if (!meeting) throw new Error("Meeting not found.");
      currentMeeting = meeting;
      document.title = meeting.title + " | Partnerportal";
      document.getElementById("title").textContent = meeting.title;
      document.getElementById("date").textContent = new Date(meeting.date + "T00:00:00").toLocaleDateString("da-DK", { day:"numeric", month:"long", year:"numeric" });
      document.getElementById("time").textContent = "kl. " + meeting.time;
      document.getElementById("address").textContent = meeting.address;
      document.getElementById("details").innerHTML = Object.keys(labels).map(function (key) {
        return '<div class="row">' + icons[key] + '<div><h2>' + labels[key] + '</h2><p class="multiline">' + PortalData.escape(meeting[key] || "Ikke tilf\u00f8jet endnu") + '</p></div></div>';
      }).join("");
      loadFiles();
      loadGuests();
      loadPartners();
      configureAttendance();
    }).catch(function () {
      document.getElementById("title").textContent = "M\u00f8det kunne ikke hentes";
    });
    document.getElementById("partner-filters").onsubmit = function (event) { event.preventDefault(); partnerPage = 1; loadPartners(); };
    document.getElementById("partner-prev").onclick = function () { if (partnerPage > 1) { partnerPage--; loadPartners(); } };
    document.getElementById("partner-next").onclick = function () { if (partnerPage * partnerPageSize < partnerTotal) { partnerPage++; loadPartners(); } };
    document.getElementById("attendance-search").oninput = renderAttendance;
    document.querySelectorAll("[data-attendance-filter]").forEach(function(button) { button.onclick = function() { attendanceFilter = button.dataset.attendanceFilter; renderAttendance(); }; });
    document.getElementById("guest-form").onsubmit = async function (event) {
      event.preventDefault();
      var form = event.currentTarget;
      var notice = document.getElementById("guest-notice");
      var data = Object.fromEntries(new FormData(form));
      data.meetingId = currentMeeting.id || currentMeeting.slug;
      try {
        await PortalData.addMeetingGuest(data);
        form.reset();
        notice.textContent = "Gæsten er tilføjet.";
        loadGuests();
      } catch (error) {
        notice.textContent = error.message;
      }
    };
    document.getElementById("guest-read").onclick = function () {
      parseGuestFile().catch(function(error) { document.getElementById("guest-notice").textContent = error.message; });
    };
    document.getElementById("guest-import").onclick = async function () {
      var notice = document.getElementById("guest-notice");
      var button = this;
      if (!pendingGuests.length) return;
      button.disabled = true;
      var imported = 0, failed = 0;
      for (var i = 0; i < pendingGuests.length; i++) {
        try {
          await PortalData.addMeetingGuest(Object.assign({ meetingId:currentMeeting.id || currentMeeting.slug }, pendingGuests[i]));
          imported++;
        } catch (error) {
          failed++;
        }
      }
      notice.textContent = imported + " gæster importeret" + (failed ? ", " + failed + " fejlede." : ".");
      pendingGuests = [];
      document.getElementById("guest-file").value = "";
      document.getElementById("guest-preview").hidden = true;
      loadGuests();
    };
  </script>
</body>
</html>

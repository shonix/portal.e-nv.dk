<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rediger bruger | Administration</title><link rel="stylesheet" href="portal-header.css?v=20260604-03"><style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9;--surface:#fff;--danger:#a12626}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:760px;margin:auto;padding:40px 20px 64px}a{color:var(--green);text-underline-offset:3px}.panel{margin-top:18px;padding:22px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}h1{margin:10px 0 6px;font-size:34px}.intro,.meta{color:var(--muted)}label{display:block;margin-top:12px;color:var(--muted);font-size:13px;font-weight:bold}input,select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:5px;background:#fff}.checks{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px}.checks label{margin:0;color:var(--navy);font-weight:normal}.checks input{width:auto}.button-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 13px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--navy);font:inherit;text-decoration:none;cursor:pointer}.primary{border-color:var(--green);background:var(--green);color:#fff}.danger{border-color:var(--danger);color:var(--danger)}.notice{min-height:20px;color:var(--green)}.missing{color:var(--danger)}</style></head><body><main><a href="admin-brugere.html">&larr; Brugere</a><h1>Rediger bruger</h1><p class="intro" id="intro">Henter bruger...</p><form class="panel" id="form" style="display:none"><label>E-mail<input name="email" type="email" required></label><label>Ny adgangskode<input name="password" type="password" minlength="10" placeholder="Lad feltet være tomt for at beholde den nuværende"></label><label>Rolle<select name="role"><option value="member">Medlem</option><option value="admin">Administrator</option></select></label><div class="checks" id="user-groups"></div><p class="meta" id="profile"></p><div class="button-row"><button class="primary">Gem bruger</button><button type="button" class="danger" id="delete-user">Slet bruger</button></div><p class="notice" id="notice"></p></form></main><script src="portal-data.js?v=20260604-03"></script><script src="portal-header.js?v=20260604-03"></script><script>
var userId=new URLSearchParams(location.search).get("id"), groups=[], currentUser=null;
function checkboxes(selected){selected=(selected||[]).map(String);return groups.map(function(g){var checked=selected.includes(String(g.id))?" checked":"";return'<label><input type="checkbox" name="groupIds" value="'+g.id+'"'+checked+'> '+PortalData.escape(g.name)+'</label>'}).join("")}
async function load(){groups=await PortalData.groups();var data=await PortalData.adminUsers({userId:userId,page:1,pageSize:5});currentUser=(data.users||[])[0];if(!currentUser){intro.textContent="Brugeren findes ikke.";return}intro.textContent=currentUser.email;form.style.display="block";form.elements.email.value=currentUser.email;form.elements.role.value=currentUser.role;document.getElementById("user-groups").innerHTML="<strong>Grupper</strong>"+checkboxes(currentUser.groupIds);profile.innerHTML=currentUser.profileId?'Profil: <a href="partner-profil.html?id='+encodeURIComponent(currentUser.profileId)+'">'+PortalData.escape(currentUser.profileName||"Se profil")+'</a>':'<span class="missing">Profil mangler</span>'}
PortalData.requireSession("admin").then(load);
form.onsubmit=async function(e){e.preventDefault();var d=Object.fromEntries(new FormData(form));d.userId=userId;d.groupIds=Array.from(form.querySelectorAll("[name=groupIds]:checked")).map(function(x){return x.value});try{await PortalData.updateUser(d);notice.textContent="Brugeren er gemt.";form.elements.password.value="";load()}catch(x){notice.textContent=x.message}};
document.getElementById("delete-user").onclick=async function(){if(!confirm("Slet denne bruger? Profilen slettes også, hvis den er knyttet til brugeren."))return;try{await PortalData.deleteUser(userId);location.href="admin-brugere.html"}catch(x){notice.textContent=x.message}};
</script></body></html>

<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mødeinvitation | Partnerportal</title><link rel="stylesheet" href="portal-header.css?v=20260717-01"><style>:root{--navy:#15243a;--green:#163674;--line:#d6dde3;--muted:#5d6b80;--page:#f5f7f9}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:720px;margin:auto;padding:42px 20px}.panel{padding:26px;border:1px solid var(--line);border-radius:8px;background:#fff}h1{margin:0 0 8px}.meta{color:var(--muted);line-height:1.5}.button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button{padding:11px 16px;border:1px solid var(--line);border-radius:5px;background:#fff;font:inherit;cursor:pointer}.primary{border-color:var(--green);background:var(--green);color:#fff}.notice{margin-top:18px;color:var(--green)}</style></head><body><main><article class="panel"><p class="meta">Mødeinvitation</p><h1 id="title">Henter invitation...</h1><p class="meta" id="details"></p><div id="program"></div><div class="button-row" id="actions" style="display:none"><button class="primary" data-response="attending">Jeg deltager</button><button data-response="not_attending">Jeg deltager ikke</button></div><p class="notice" id="notice"></p></article></main><script src="portal-data.js?v=20260610-01"></script><script src="portal-header.js?v=20260717-04"></script><script>
var token=new URLSearchParams(location.search).get("token"),current=null;
function statusText(m){if(!m.response)return"";if(m.response==="not_attending")return"Du har svaret, at du ikke deltager.";if(m.approvalStatus==="pending")return"Din deltagelse afventer godkendelse.";if(m.approvalStatus==="declined")return"Din deltagelse er blevet afvist.";return"Du er tilmeldt mødet."}
PortalData.requireSession().then(function(){return PortalData.meetingInvitation(token)}).then(function(data){current=data.meeting;title.textContent=current.title;details.textContent=current.date+" kl. "+current.time+" · "+current.address;program.innerHTML=current.program?'<h2>Program</h2><p class="meta">'+PortalData.escape(current.program)+'</p>':"";notice.textContent=statusText(current);if(current.status!=="cancelled")actions.style.display="flex";else notice.textContent="Mødet er aflyst."}).catch(function(x){title.textContent="Invitationen kunne ikke hentes";details.textContent=x.message});
document.querySelectorAll("[data-response]").forEach(function(b){b.onclick=async function(){try{var r=await PortalData.saveMeetingRsvp(token,b.dataset.response);current.response=r.response;current.approvalStatus=r.approvalStatus;notice.textContent=statusText(current)}catch(x){notice.textContent=x.message}}});
</script></body></html>
